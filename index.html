<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiko — official websites & social channels</title>
<meta name="description" content="The internal directory of every official website and social media channel, always up to date.">
<meta name="theme-color" content="#5b6bff">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Aiko">
<meta property="og:description" content="Every official website and social channel in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b6bff'/%3E%3Cpath d='M9 21l7-13 7 13z' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@13/font/simple-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* ═══════════════ tokens ═══════════════ */
:root{
  --a1:#5b6bff; --a2:#a855f7;
  --bg:#f7f8fb; --bg-tint:#eef0f8;
  --surf:#ffffff; --surf2:#f6f7fb; --surf3:#eef0f6;
  --glass:rgba(255,255,255,.75);
  --tx:#0b0e18; --tx2:#5a6280; --tx3:#9aa1bb;
  --ln:#e7e9f2; --ln2:#f0f1f7;
  --red:#e0342c; --amb:#d97706; --grn:#0f9d58;
  --s1:0 1px 2px rgba(12,17,40,.05);
  --s2:0 1px 3px rgba(12,17,40,.05),0 10px 26px -14px rgba(12,17,40,.2);
  --s3:0 2px 8px rgba(12,17,40,.06),0 26px 60px -24px rgba(12,17,40,.3);
  --s4:0 40px 90px -30px rgba(12,17,40,.45);
  --rl:20px; --rm:14px; --rs:10px;
  /* the browser draws select popups, the date picker, scrollbars and form focus rings itself, and
     without this it draws all of them light — a white date picker over the dark theme */
  color-scheme:light;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070810; --bg-tint:#0c0e18;
  --surf:#101320; --surf2:#161a2a; --surf3:#1d2234;
  --glass:rgba(14,17,28,.78);
  --tx:#f0f2fa; --tx2:#98a0bd; --tx3:#69708c;
  --ln:#212639; --ln2:#191d2c;
  --red:#ff6b63; --amb:#fbbf24; --grn:#3ddc84;
  --s1:0 1px 2px rgba(0,0,0,.35);
  --s2:0 1px 3px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.75);
  --s3:0 2px 10px rgba(0,0,0,.35),0 30px 70px -28px rgba(0,0,0,.9);
  --s4:0 40px 100px -30px rgba(0,0,0,1);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","tnum";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--a1) 28%,transparent)}
.gt{background:linear-gradient(100deg,var(--a1),var(--a2) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* ambient light */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.28}
html[data-theme="dark"] .aura i{opacity:.2}
.aura i:nth-child(1){width:44vw;height:44vw;background:var(--a1);top:-16vw;left:-10vw;animation:dr1 24s ease-in-out infinite}
.aura i:nth-child(2){width:36vw;height:36vw;background:var(--a2);top:4vw;right:-12vw;animation:dr2 28s ease-in-out infinite}
@keyframes dr1{50%{transform:translate(5vw,6vw) scale(1.15)}}
@keyframes dr2{50%{transform:translate(-6vw,8vw) scale(.9)}}
@media(prefers-reduced-motion:reduce){.aura i{animation:none}}

/* ═══════════════ buttons ═══════════════ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;
  border-radius:11px;font-weight:600;font-size:13.5px;letter-spacing:-.1px;white-space:nowrap;
  background:var(--surf2);border:1px solid var(--ln);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.35),box-shadow .18s,background .18s,border-color .18s,color .18s}
.b:hover{transform:translateY(-1.5px);box-shadow:var(--s1);border-color:color-mix(in srgb,var(--a1) 42%,var(--ln))}
.b:active{transform:translateY(0) scale(.97)}
.b.p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;
  box-shadow:0 6px 20px -9px color-mix(in srgb,var(--a1) 90%,transparent)}
.b.p:hover{box-shadow:0 14px 32px -11px color-mix(in srgb,var(--a1) 95%,transparent)}
.b.g{background:none;border-color:transparent;color:var(--tx2)}
.b.g:hover{background:var(--surf2);color:var(--tx);border-color:var(--ln)}
.b.d{color:var(--red)}
.b.d:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.b.s{padding:6px 11px;font-size:12.5px;border-radius:9px;gap:5px}
.b.i{padding:0;width:32px;height:32px;border-radius:9px;flex:none}
.b.i.s{width:28px;height:28px;border-radius:8px}
.b.xl{padding:13px 22px;font-size:15px;border-radius:13px}
.b[disabled]{opacity:.4;pointer-events:none}
.b svg{width:15px;height:15px;flex:none}
.b.xl svg{width:17px;height:17px}
.b.i.s svg{width:13px;height:13px}

/* ═══════════════ topbar ═══════════════ */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:11px;padding:11px 20px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.7);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16.5px;letter-spacing:-.4px}
.brand .m{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 5px 16px -6px color-mix(in srgb,var(--a1) 90%,transparent)}
.brand .m svg{width:16px;height:16px}
.sp{flex:1}
.sbox{display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--ln);
  border-radius:999px;padding:8px 14px;min-width:210px;transition:.2s}
.sbox:focus-within{border-color:var(--a1);background:var(--surf);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 13%,transparent)}
.sbox input{background:none;border:0;outline:none;width:100%;min-width:0;font-size:14px}
.sbox svg{width:15px;height:15px;color:var(--tx3);flex:none}
.kb{font:600 10.5px/1 ui-monospace,monospace;color:var(--tx3);border:1px solid var(--ln);border-radius:5px;padding:3px 5px;background:var(--surf);flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:6px 11px;
  border-radius:999px;border:1px solid var(--ln);background:var(--surf2);color:var(--tx2)}
.sync .d{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.sync.on .d{background:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 22%,transparent)}
.sync.warn{color:var(--amb);border-color:color-mix(in srgb,var(--amb) 40%,transparent)}
.sync.warn .d{background:var(--amb)}
.sync.busy .d{background:var(--a1);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ═══════════════ layout ═══════════════ */
.shell{display:grid;grid-template-columns:262px 1fr;gap:20px;max-width:1460px;margin:0 auto;padding:20px;align-items:start}
.card{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rl);box-shadow:var(--s2)}
aside{position:sticky;top:82px}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 15px;border-bottom:1px solid var(--ln2)}
.rail-h h2{margin:0;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);font-weight:750}
.rail{max-height:calc(100vh - 240px);overflow:auto;padding:9px}
.rail::-webkit-scrollbar{width:7px}.rail::-webkit-scrollbar-thumb{background:var(--ln);border-radius:8px}
.oi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;
  border:1px solid transparent;margin-bottom:2px;transition:.16s;position:relative}
.oi:hover{background:var(--surf2)}
.oi.on{background:color-mix(in srgb,var(--a1) 10%,transparent);border-color:color-mix(in srgb,var(--a1) 26%,transparent)}
.oi.on::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:3px;height:20px;
  border-radius:0 3px 3px 0;background:linear-gradient(var(--a1),var(--a2))}
.oi .nm{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.oi .sb{font-size:11.5px;color:var(--tx2);display:block}

/* logo blocks */
.lg{width:36px;height:36px;border-radius:11px;flex:none;position:relative;overflow:hidden;box-shadow:var(--s1);
  display:grid;place-items:center;background:var(--surf3)}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.lg .fb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:750;font-size:13px;letter-spacing:-.4px}
.lg.xl{width:64px;height:64px;border-radius:18px}
.lg.xl .fb{font-size:23px}
.lg.sm{width:30px;height:30px;border-radius:9px}
.lg.sm .fb{font-size:11px}

/* ═══════════════ detail ═══════════════ */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{padding:22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),transparent)}
.hero-top{display:flex;gap:16px;align-items:flex-start}
.hero h1{margin:0 0 5px;font-size:26px;letter-spacing:-.9px;font-weight:780;line-height:1.15}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--ln);color:var(--tx2)}
.notes{margin:11px 0 0;color:var(--tx2);font-size:13.5px;white-space:pre-wrap;max-width:72ch}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--ln2)}

.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.m{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);padding:14px 16px;box-shadow:var(--s1)}
.m b{display:block;font-size:24px;font-weight:750;letter-spacing:-1px;line-height:1.1}
.m span{font-size:11.5px;color:var(--tx2);font-weight:650;letter-spacing:.02em}
.m .hl{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:650}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:0 2px}
.sec-h h3{margin:0;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.3px;font-weight:720}
.sec-h h3 svg{width:16px;height:16px;color:var(--a1)}
.ct{font-size:11.5px;font-weight:750;color:var(--tx2);background:var(--surf2);border:1px solid var(--ln);padding:1px 8px;border-radius:999px}

/* tile grid — the main visual upgrade */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.t{--c:var(--a1);position:relative;background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);
  padding:14px;box-shadow:var(--s1);overflow:hidden;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .22s,border-color .2s}
.t::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);opacity:.9}
.t::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:.22s;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 13%,transparent),transparent 70%)}
.t:hover{transform:translateY(-3px);box-shadow:var(--s3);border-color:color-mix(in srgb,var(--c) 40%,var(--ln))}
.t:hover::after{opacity:1}
.t .r1{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.t .nm{display:block;font-weight:680;font-size:14px;letter-spacing:-.2px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .hd{display:block;font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .lk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--ln2);transition:.16s}
.t .lk:hover{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.t .lk svg{width:12px;height:12px;flex:none;opacity:.7}
.t .tb{display:flex;gap:3px;justify-content:flex-end;margin-top:9px;opacity:0;transform:translateY(4px);transition:.2s}
.t:hover .tb,.t:focus-within .tb{opacity:1;transform:none}
@media(hover:none){.t .tb{opacity:1;transform:none}}
.chip{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;
  font-weight:800;font-size:11.5px;box-shadow:var(--s1);border:1px solid rgba(255,255,255,.16);background:var(--c)}
.chip i.si{font-size:16px;line-height:1}
.chip svg{width:17px;height:17px}
.chip .ini{display:block}
body.si-ok .chip .ini{display:none}
body:not(.si-ok) .chip i.si{display:none}
.hd-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto;background:var(--tx3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--tx3) 18%,transparent);cursor:help}
.hd-dot.ok{background:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 20%,transparent)}
.hd-dot.warn{background:var(--amb);box-shadow:0 0 0 3px color-mix(in srgb,var(--amb) 20%,transparent)}
.hd-dot.bad{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent)}
.hd-dot.spin{background:var(--a1);animation:pulse .9s ease-in-out infinite}

.empty{padding:38px 20px;text-align:center;color:var(--tx2);font-size:13.5px;
  border:1.5px dashed var(--ln);border-radius:var(--rm);background:var(--surf2)}
.empty b{display:block;color:var(--tx);margin-bottom:5px;font-size:15px;font-weight:700}
.empty .e{width:44px;height:44px;border-radius:13px;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--surf);border:1px solid var(--ln);color:var(--tx3)}
.empty .e svg{width:20px;height:20px}
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-radius:var(--rm);font-size:13.5px;line-height:1.55;
  background:color-mix(in srgb,var(--a1) 8%,transparent);border:1px solid color-mix(in srgb,var(--a1) 24%,transparent)}
.note.warn{background:color-mix(in srgb,var(--amb) 10%,transparent);border-color:color-mix(in srgb,var(--amb) 34%,transparent)}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--a1)}
.note.warn svg{color:var(--amb)}
.note .b{margin-left:auto;flex:none}

footer{border-top:1px solid var(--ln);padding:24px 20px 36px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.9}

/* ═══════════════ modal ═══════════════ */
.veil{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:18px;
  background:rgba(5,7,15,.62);backdrop-filter:blur(6px)}
.veil.on{display:grid}
.mo{background:var(--surf);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--s4);
  width:100%;max-width:490px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mo.w{max-width:660px}
.mo.xw{max-width:980px}

/* ═══════════════ daily check report ═══════════════ */
/* ── the control strip ──
   These four are set once and then rarely touched, so they are deliberately quiet — but they were
   also four bare dropdowns in a row, and "±15 min" and "max 4" say nothing at all about what they
   govern until you hover them. Each carries its own standing label now. */
.dc-top{border:1px solid var(--ln);border-radius:var(--rm);background:var(--surf2);
  padding:11px 13px 12px;margin-bottom:11px}
.dc-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px}
.dc-bar .sp{flex:1}
.dc-fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.dc-fld > span{font-size:9.5px;font-weight:780;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tx3);padding-left:2px;white-space:nowrap}
/* a select is not a button: it needs its own colours, and the button hover-lift reads as a bug on it */
.dc-bar select{padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;border-radius:var(--rs);
  background:var(--surf);color:var(--tx);border:1px solid var(--ln);cursor:pointer}
.dc-bar select:hover{border-color:color-mix(in srgb,var(--a1) 42%,var(--ln))}
.dc-bar select:focus-visible{outline:2px solid var(--a1);outline-offset:-1px}
.dc-when{font-size:11px;color:var(--tx3);font-weight:600;white-space:nowrap;padding-bottom:7px}
.dc-day{border:1px solid var(--ln);border-radius:14px;margin-bottom:13px;overflow:hidden;background:var(--surf2)}
.dc-day:last-child{margin-bottom:0}
.dc-dh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 14px;background:var(--surf)}
.dc-dh b{font-size:14.5px;letter-spacing:-.2px}
.dc-dh .sp{flex:1}
.dc-pill{font-size:11px;font-weight:730;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.dc-pill.ok{background:color-mix(in srgb,var(--grn) 17%,transparent);color:var(--grn)}
.dc-pill.short{background:color-mix(in srgb,var(--red) 17%,transparent);color:var(--red)}
.dc-pill.un{background:color-mix(in srgb,var(--tx3) 20%,transparent);color:var(--tx2)}
.dc-pill.sg{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
/* the readout of the controls directly above it — which is why it sits inside the same panel
   rather than floating between the sources and the tabs, where it belonged to neither */
.dc-win{font-size:11.5px;color:var(--tx3);font-weight:600;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--ln2)}
.dc-win b{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;font-weight:700}

/* sources — what has reported, and what is still waiting */
.dc-srcs{border:1px solid var(--ln);border-radius:13px;overflow:hidden;margin-bottom:13px}
.dc-run{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;
  background:color-mix(in srgb,var(--a1) 7%,var(--surf2));border-bottom:1px solid var(--ln2)}
.dc-run .sp{flex:1}
.dc-src{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surf2);font-size:12.5px}
.dc-src + .dc-src{border-top:1px solid var(--ln2)}
/* a source this org has no channels for — present so the split stays legible, but muted, because
   it is not a source that failed */
.dc-src.none{opacity:.55}
/* Same specificity as `.dc-src .dot.off` below and declared earlier, so the red lost to it and a
   source this org simply has no channels for rendered as a red "broken" dot. Qualified so the
   neutral wins for the one case it is meant to cover. */
.dc-src.none .dot,.dc-src.none .dot.off{background:var(--tx3)}
.dc-src b{font-size:12.5px;font-weight:700}
.dc-src .sp{flex:1}
.dc-sw{color:var(--tx3);font-size:11.5px}
.dc-sn{color:var(--tx2);font-size:11.5px;font-weight:640;white-space:nowrap}
.dc-src .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tx3)}
.dc-src .dot.on{background:var(--grn)}
.dc-src .dot.part{background:var(--amb)}
.dc-src .dot.off{background:color-mix(in srgb,var(--red) 70%,transparent)}

/* tabs */
.dc-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--ln);margin-bottom:14px}
.dc-tab{padding:8px 13px;font:inherit;font-size:12.5px;font-weight:650;color:var(--tx2);
  background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.dc-tab:hover{color:var(--tx)}
.dc-tab.on{color:var(--a1);border-bottom-color:var(--a1)}
.dc-tab .ct{font-size:10px;padding:1px 5px}

/* post log */
/* The centring rule lives on `table.dc.mx`, and the post-log table carries no .mx — so every
   ctr on Views/Likes/Comments/Length silently did nothing and the figures ran ragged-left, which
   also wasted the tabular-nums they are set in. Numbers align right, where digits line up. */
table.dc td.num,table.dc th.num{text-align:right;font-variant-numeric:tabular-nums}
table.dc .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
table.dc td.cap{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
table.dc tr.warnrow td{background:color-mix(in srgb,var(--amb) 9%,transparent)}
table.dc a{color:var(--a1)}
table.dc a svg{width:14px;height:14px;vertical-align:-2px}

/* per channel */
.dc-ch{border:1px solid var(--ln);border-radius:13px;padding:11px 13px;margin-bottom:9px;background:var(--surf2)}
.dc-cht{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-cht b{font-size:13.5px}
.dc-cht .sp{flex:1}
.dc-plist{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.dc-p{display:flex;gap:9px;padding:7px 9px;border-radius:10px;background:var(--surf);border:1px solid var(--ln2)}
.dc-p.bad{border-color:color-mix(in srgb,var(--amb) 45%,var(--ln))}
.dc-pm{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dc-pm b{font-size:12px}
.dc-pill.okc{background:color-mix(in srgb,var(--grn) 13%,transparent);color:var(--grn);
  outline:1px dashed color-mix(in srgb,var(--grn) 50%,transparent);outline-offset:-1px}
.dc-pt{margin-top:4px;font-size:12px;color:var(--tx2);line-height:1.45}
.dc-th{width:54px;height:54px;object-fit:cover;border-radius:9px;flex:none;background:var(--surf)}
.dc-th.sm{width:40px;height:40px;border-radius:7px}
/* the drop's artwork rather than this channel's own — dashed so the difference is visible */
.dc-th.borrowed{outline:1px dashed color-mix(in srgb,var(--tx3) 60%,transparent);outline-offset:1px;opacity:.75}
.dc-spread{display:flex;flex-wrap:wrap;gap:9px;margin-top:5px;font-size:11.5px;color:var(--tx3)}
.dc-spread b{font-variant-numeric:tabular-nums;color:var(--tx2);font-size:11.5px}
.dc-dt2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* headline — the answer before any detail, and the one thing that should land first. The icon
   sits in its own tinted disc so the verdict is readable as a shape before a word of it is read. */
.dc-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--rm);
  margin-bottom:14px;border:1px solid var(--ln);background:var(--surf2);font-size:13px}
.dc-head > svg{width:20px;height:20px;flex:none;padding:7px;border-radius:50%;box-sizing:content-box;
  background:color-mix(in srgb,var(--tx3) 15%,transparent);color:var(--tx2)}
.dc-head b{font-size:14.5px;letter-spacing:-.2px}
.dc-head.good{border-color:color-mix(in srgb,var(--grn) 38%,var(--ln));
  background:color-mix(in srgb,var(--grn) 6%,var(--surf2))}
.dc-head.good > svg{color:var(--grn);background:color-mix(in srgb,var(--grn) 16%,transparent)}
.dc-head.bad{border-color:color-mix(in srgb,var(--red) 38%,var(--ln));
  background:color-mix(in srgb,var(--red) 5%,var(--surf2))}
.dc-head.bad > svg{color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent)}
.dc-head.warn{border-color:color-mix(in srgb,var(--amb) 38%,var(--ln));
  background:color-mix(in srgb,var(--amb) 6%,var(--surf2))}
.dc-head.warn > svg{color:var(--amb);background:color-mix(in srgb,var(--amb) 16%,transparent)}
.dc-sub{color:var(--tx2);font-size:12.5px;margin-top:3px}
.dc-alist{margin-top:8px;display:flex;flex-direction:column;gap:5px}
/* Two columns, not a wrapping flex row. As a flex row the badge, the channel name and the
   sentence were three siblings, so a long sentence wrapped back to the left margin and sat under
   its own badge — which read as a second, unlabelled alert. The grid pins the badge in its own
   column and lets the sentence wrap under itself. */
.dc-al{font-size:12.5px;color:var(--tx2);display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:7px;align-items:baseline}
.dc-al .dc-at{min-width:0}
.dc-al b{font-size:12.5px;color:var(--tx);font-weight:650}
.dc-ak{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:1.5px 6px;border-radius:20px;flex:none;
  background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.dc-al.lang .dc-ak{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
/* A caption match that is not word-perfect. Deliberately the loudest badge here: it is the only
   alert that argues with a ✓ the report has already printed, and a quiet version of it is what
   let a Facebook post that never went out read as delivered. */
.dc-al.verify .dc-ak{background:color-mix(in srgb,var(--amb) 30%,transparent);color:var(--amb)}
.dc-al.over .dc-ak{background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1)}
/* "maybe" is a short count on a channel whose whole window could not be read — a question, not
   a finding, and it must not look like one */
.dc-al.maybe .dc-ak{background:color-mix(in srgb,var(--tx3) 22%,transparent);color:var(--tx2)}
/* "late" is the drop that did arrive, hours after the rest. It is worth saying and it is not a
   failure, so it reads quieter than a miss — the same weight as the informational counts. */
.dc-al.late .dc-ak{background:color-mix(in srgb,var(--a1) 15%,transparent);color:var(--a1)}
.dc-pill.late{background:color-mix(in srgb,var(--a1) 15%,transparent);color:var(--a1)}
.dc-lt{font-style:normal;font-weight:750;font-size:10px;margin-left:3px;padding:0 4px;
  border-radius:20px;background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1)}
.dc-bar input[type=date]{padding:6px 9px;font:inherit;font-size:12.5px;font-weight:600;
  border-radius:9px;background:var(--surf2);color:var(--tx);border:1px solid var(--ln)}

/* matrix — a row per channel, a column per drop */
table.dc.mx th.ctr,table.dc.mx td.ctr{text-align:center}
table.dc.mx th.ctr .dy{display:block;font-size:9px;color:var(--tx3);font-weight:600;letter-spacing:0}
/* how many channels that drop actually reached. A column that underperformed is then visible from
   the header alone, without reading down the whole column counting ticks. */
table.dc.mx th.ctr .cov{display:block;font-size:9px;font-weight:700;letter-spacing:0;
  color:var(--tx3);font-variant-numeric:tabular-nums;margin-top:2px}
/* amber, not red: the crosses in the column are the failure and own that colour. This is a
   scanning aid pointing at which column to look down, and three red counts in the header simply
   competed with the cells they were meant to lead the eye to. */
table.dc.mx th.ctr .cov.short{color:var(--amb)}
/* The matrix is read purely by position — a grid of ✓ ≈ ✗ · where only the column says which drop
   a mark belongs to. Past about ten channels the drop times scrolled out of the modal body and
   left unlabelled columns behind, so the head is pinned. */
table.dc.mx thead th{position:sticky;top:0;z-index:2;background:var(--surf);
  box-shadow:inset 0 -1px 0 var(--ln)}
table.dc.mx .stick{position:sticky;left:0;background:var(--surf2);z-index:1;
  max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.dc.mx thead .stick{z-index:3}
table.dc.mx tr.lgrp .stick{background:var(--surf)}
/* the channel column stays put while the drops scroll under it — it needs an edge, or the two
   halves visually merge the moment the table is wider than the modal */
table.dc.mx .stick::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;
  background:var(--ln)}
table.dc.mx tbody tr:not(.lgrp):hover td{background:color-mix(in srgb,var(--a1) 6%,transparent)}
table.dc.mx tbody tr:not(.lgrp):hover .stick{background:color-mix(in srgb,var(--a1) 6%,var(--surf2))}
.cl{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:7px;font-size:13px;font-weight:800;line-height:1}
.cl sup{font-size:8px;font-weight:700;margin-left:1px}
.cl.ok{background:color-mix(in srgb,var(--grn) 16%,transparent);color:var(--grn)}
.cl.okc{background:color-mix(in srgb,var(--grn) 12%,transparent);color:var(--grn);
  outline:1px dashed color-mix(in srgb,var(--grn) 55%,transparent);outline-offset:-1px}
/* Posted, but hours behind the rest of its drop. It stays a solid green tick, because it did go
   out — and it is marked with a corner dot rather than a dashed outline and an accent tint. Two
   reasons. The dashed outline already means "arrived at indirectly" (okc, borrowed art) and must
   not also mean "arrived late". And --a1 is user-configurable across seven themes plus custom, so
   an accent-tinted cell beside a --grn one merges entirely the moment somebody picks green. */
.cl.ok.lt{position:relative}
.cl.ok.lt::after{content:"";position:absolute;top:-1px;right:-1px;width:7px;height:7px;
  border-radius:50%;background:var(--a1);box-shadow:0 0 0 1.5px var(--surf2)}
/* ticked by a person. A tick — the post did go out — but hollow, so a glance across the matrix
   still separates what was measured from what someone vouched for. */
.cl.okh{background:none;color:var(--grn);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--grn) 55%,transparent)}
/* a cell waiting to be answered invites the click; the rest of the matrix never moves under the
   cursor, so the affordance is only ever where there is something to do */
td.ask .cl{cursor:pointer;transition:transform .12s,box-shadow .12s}
td.ask:hover .cl{transform:scale(1.14);box-shadow:0 0 0 2px color-mix(in srgb,var(--a1) 45%,transparent)}
td.ask .cl.none{border-style:dashed;border-color:color-mix(in srgb,var(--a1) 45%,var(--ln))}
.dc-ask{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dc-askb{font:inherit;font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;
  border:1px solid var(--ln);background:var(--surf);color:var(--tx2);cursor:pointer;
  white-space:nowrap;text-decoration:none;display:inline-block}
.dc-askb:hover{border-color:var(--a1);color:var(--a1)}
.cl.miss{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.cl.lang{background:color-mix(in srgb,var(--amb) 20%,transparent);color:var(--amb)}
/* Viber "not seen while online" — a flag to check, so amber (like lang) with a dashed edge to say
   it is an inference, not a measured cross */
.cl.maybe{background:color-mix(in srgb,var(--amb) 16%,transparent);color:var(--amb);
  border:1px dashed color-mix(in srgb,var(--amb) 55%,transparent);font-weight:800}
/* A hole, not a blank. At 55% opacity the dot was indistinguishable from an empty cell, so "we
   have no data for this channel" read as "nothing was posted" — the one confusion this report
   exists to prevent. An outlined empty box reads as a cell nobody could fill. */
.cl.none{color:var(--tx3);background:none;border:1px dashed var(--ln);font-size:11px}
/* full sentences lived under a bare unlabelled header and set the table's width from the far
   right, pushing the drop columns the report is actually read for off-screen */
table.dc.mx th.whyc,table.dc.mx td.mt{max-width:190px;white-space:normal;line-height:1.4}
.dc-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11.5px;color:var(--tx3)}
.dc-key span{display:inline-flex;align-items:center;gap:5px}
.dc-key .cl{width:19px;height:19px;font-size:11px}

/* what went out */
.dc-drop{border:1px solid var(--ln);border-radius:12px;padding:10px 13px;margin-bottom:8px;background:var(--surf2)}
.dc-drop.gap{border-color:color-mix(in srgb,var(--red) 42%,var(--ln))}
.dc-dt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-dt b{font-size:13.5px}
.dc-dt .sp{flex:1}
.dc-cap{margin-top:7px;font-size:12.5px;color:var(--tx2);line-height:1.5}
.dc-miss{margin-top:6px;font-size:12px;color:var(--red);font-weight:650}
.dc-tw{overflow-x:auto;border-top:1px solid var(--ln2)}
table.dc{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
table.dc th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--tx3);font-weight:730;padding:8px 12px;background:var(--surf)}
table.dc td{padding:8px 12px;border-top:1px solid var(--ln2);vertical-align:middle}
/* the language-group divider inside the matrix. Named lgrp, not lg: .lg is the logo block
   (36px, display:grid) and a <tr class="lg"> inherited it, which turned the row into a grid,
   dropped its colspan and squeezed every group heading into a 36px column. */
table.dc tr.lgrp td{background:var(--surf);font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);
  /* an accent rule on the leading edge, so a group reads as a deliberate divider rather than as
     one more row that happens to be shouting */
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--a1) 45%,transparent);
  padding-top:11px;padding-bottom:7px}
table.dc tr.lgrp + tr td{border-top-color:transparent}
table.dc .ch{font-weight:650}
table.dc .mt{color:var(--tx3);font-size:11.5px}
table.dc input.cnt{width:58px;padding:4px 7px;border:1px solid var(--ln);border-radius:7px;
  background:var(--bg);color:var(--tx);font:inherit;text-align:center}
.dc-empty{padding:26px 18px;text-align:center;color:var(--tx2);font-size:13px}
/* the four tabs differ wildly in height, and without a floor the whole modal snapped taller and
   shorter as you moved between them, throwing the footer buttons around under the cursor */
.dc-panel{min-height:340px}
/* a suggestion must never look like a measurement — the dashed border is the same language okc
   and borrowed art already use for "arrived at indirectly", here on a value awaiting confirmation */
table.dc input.cnt.guess{border-style:dashed;border-color:color-mix(in srgb,var(--amb) 55%,var(--ln));
  color:var(--tx2)}
.dc-pill.guess{background:none;color:var(--amb);
  outline:1px dashed color-mix(in srgb,var(--amb) 55%,transparent);outline-offset:-1px}

/* narrow screens — the modal is the densest thing in the app and had no handling at all */
@media (max-width:640px){
  .mb{padding:13px}
  .dc-top{padding:10px}
  .dc-bar{gap:7px}
  .dc-fld{flex:1 1 132px}
  .dc-bar select,.dc-bar input[type=date]{width:100%}
  .dc-when{padding-bottom:0;width:100%}
  /* the strip scrolls sideways as one row; without holding the tabs their own width they shrink
     instead and "What went out" breaks across three lines */
  .dc-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .dc-tabs::-webkit-scrollbar{display:none}
  .dc-tab{flex:none;white-space:nowrap}
  /* the source rows carry four things across; let them stack rather than run off the edge */
  .dc-src{flex-wrap:wrap;row-gap:2px}
  .dc-src .sp{flex-basis:100%;height:0}
  .dc-run{padding:10px}
  table.dc.mx .stick{max-width:132px}
  /* three buttons do not fit on one line at this width, and the first was sliding off it */
  .mf{flex-wrap:wrap;padding:12px 13px}
}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px;border-bottom:1px solid var(--ln2)}
.mh h3{margin:0;font-size:17px;letter-spacing:-.4px;display:flex;align-items:center;gap:9px;font-weight:730}
.mh h3 svg{width:18px;height:18px;color:var(--a1)}
.mb{padding:19px;overflow:auto}
.mf{display:flex;gap:9px;justify-content:flex-end;padding:15px 19px;border-top:1px solid var(--ln2);background:var(--surf2)}
.f{margin-bottom:15px}.f:last-child{margin-bottom:0}
.f label{display:block;font-size:11.5px;font-weight:750;margin-bottom:7px;color:var(--tx2);letter-spacing:.05em;text-transform:uppercase}
.f input[type=text],.f input[type=password],.f select,.f textarea{width:100%;padding:11px 13px;border:1px solid var(--ln);
  border-radius:11px;background:var(--surf2);outline:none;transition:.18s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--a1);background:var(--surf);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 13%,transparent)}
.f textarea{resize:vertical;min-height:70px}
.hint{font-size:12px;color:var(--tx3);margin-top:7px;line-height:1.55}
.err{color:var(--red);font-size:13px;font-weight:650;margin-top:12px;display:none;padding:9px 12px;
  border-radius:10px;background:color-mix(in srgb,var(--red) 10%,transparent)}
.err.on{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.dv{height:1px;background:var(--ln2);margin:19px 0}
.sr{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:10px 0}
.sr .t1{font-weight:660;font-size:14px}
.sr .d1{font-size:12.5px;color:var(--tx2)}
.pr{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;transition:.15s}
.pr:hover{background:var(--surf2)}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border-radius:9px;border:2.5px solid transparent;cursor:pointer;transition:.16s}
.sw:hover,.sw.on{transform:scale(1.12)}
.sw.on{border-color:var(--tx)}
.seg{display:flex;gap:3px;background:var(--surf2);border:1px solid var(--ln);border-radius:11px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:660;color:var(--tx2);transition:.16s}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--s1)}
pre.code{margin:0;padding:13px 15px;border-radius:12px;background:var(--surf3);border:1px solid var(--ln);
  font:500 12px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre;color:var(--tx)}
#qrbox{display:grid;place-items:center;padding:18px;background:#fff;border-radius:16px;border:1px solid var(--ln)}
#qrbox canvas,#qrbox img{display:block}

#toast{position:fixed;bottom:24px;left:50%;z-index:220;display:flex;align-items:center;gap:9px;padding:12px 18px;
  border-radius:13px;font-weight:650;font-size:13.5px;pointer-events:none;background:var(--tx);color:var(--bg);
  box-shadow:var(--s4);opacity:0;transform:translateX(-50%) translateY(22px);max-width:min(90vw,460px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);transition:.26s cubic-bezier(.2,.9,.3,1.2)}
#toast svg{width:15px;height:15px;flex:none}

.sk{background:linear-gradient(90deg,var(--surf2),var(--surf3),var(--surf2));background-size:200% 100%;
  animation:sh 1.3s linear infinite;border-radius:var(--rm);height:96px}
@keyframes sh{to{background-position:-200% 0}}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;padding:14px;gap:14px}
  aside{position:static}
  .rail{max-height:270px}
  header{padding:10px 14px}
  .sbox{order:9;width:100%;min-width:0}
  .kb{display:none}
  .hero{padding:18px}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}

/* ── the single dashboard: hero + the channels it watches ─────────────────── */
.dash{max-width:940px;margin:0 auto;padding:30px 22px 60px;display:flex;flex-direction:column;gap:26px}

.hero-card{position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--ln);
  border-radius:var(--rl);box-shadow:var(--s2);padding:38px 34px 34px}
.hero-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,var(--a1),var(--a2),transparent)}
.hero-card::after{content:"";position:absolute;top:-40%;right:-10%;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--a2) 16%,transparent),transparent 68%);pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:750;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx2);margin-bottom:16px}
.dot-live{width:8px;height:8px;border-radius:50%;background:#22c55e;
  box-shadow:0 0 0 0 color-mix(in srgb,#22c55e 70%,transparent);animation:live 1.8s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,#22c55e 60%,transparent)}
  100%{box-shadow:0 0 0 9px transparent}}
.hero-h{margin:0;font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.hero-p{margin:14px 0 0;max-width:60ch;font-size:15px;line-height:1.6;color:var(--tx2)}
.hero-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:26px}
.hero-when{font-size:13px;color:var(--tx3)}

.channels-h,.ch-group-h{display:flex;align-items:center;gap:10px}
.channels-h{font-size:13px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;
  color:var(--tx2);margin-bottom:2px}
.channels{display:flex;flex-direction:column;gap:22px}
.ch-group{display:flex;flex-direction:column;gap:12px}
.ch-group-h{font-size:13.5px;font-weight:700;color:var(--tx)}
.ch-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

.ch-card{display:flex;align-items:center;gap:13px;padding:14px 15px;text-decoration:none;
  background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);box-shadow:var(--s1);
  transition:transform .16s,box-shadow .16s,border-color .16s}
.ch-card:hover{transform:translateY(-2px);box-shadow:var(--s2);
  border-color:color-mix(in srgb,var(--a1) 38%,var(--ln))}
.ch-meta{display:flex;flex-direction:column;min-width:0;gap:2px;flex:1}
.ch-name{font-size:14px;font-weight:700;color:var(--tx);line-height:1.2}
.ch-handle{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-go{flex:none;color:var(--tx3);width:16px;height:16px;transition:color .16s,transform .16s}
.ch-card:hover .ch-go{color:var(--a1);transform:translate(2px,-2px)}

/* ── Viber pipeline monitor ── */
.pipe{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--ln);
  border-radius:var(--rm);box-shadow:var(--s1);padding:13px 18px;flex-wrap:wrap}
.pipe-dot{width:12px;height:12px;border-radius:50%;flex:none;position:relative;background:var(--tx3)}
.pipe-dot.ok{background:#22c55e}
.pipe-dot.bad{background:#ef4444}
.pipe-dot.idle{background:var(--tx3)}
.pipe-dot.ok::after{content:"";position:absolute;inset:0;border-radius:50%;background:#22c55e;
  animation:pipepulse 1.8s ease-out infinite}
.pipe-dot.bad::after{content:"";position:absolute;inset:0;border-radius:50%;background:#ef4444;
  animation:pipepulse 2.6s ease-out infinite}
@keyframes pipepulse{0%{transform:scale(1);opacity:.65}100%{transform:scale(3.4);opacity:0}}
.pipe-main{flex:1;min-width:200px}
.pipe-eyebrow{font-size:10.5px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
.pipe-sub{font-size:14px;color:var(--tx2);margin-top:2px}
.pipe-sub b{color:var(--tx);font-weight:700}
.pipe-at{color:var(--tx3);font-size:12.5px}
.pipe-chans{display:flex;gap:8px;flex-wrap:wrap}
.pipe-chan{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;
  color:var(--tx2);background:var(--surf2);border:1px solid var(--ln);border-radius:999px;padding:5px 12px}
.pipe-chan .pcd{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}
.pipe-chan.on .pcd{background:#22c55e}
.pipe-chan.stale .pcd{background:#f59e0b}
@media(prefers-reduced-motion:reduce){.pipe-dot::after{animation:none!important}}

/* ── Viber live log ── */
.vlog{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rl);box-shadow:var(--s2);
  padding:clamp(16px,3.5vw,22px);margin-top:8px}
.vlog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.vlog-title{display:flex;align-items:center;gap:9px;font-family:inherit;font-weight:800;font-size:16px;letter-spacing:-.01em}
.vlog-live{width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none;position:relative}
.vlog-live::after{content:"";position:absolute;inset:0;border-radius:50%;background:#22c55e;animation:pipepulse 1.8s ease-out infinite}
.vlog-sub{font-size:12.5px;color:var(--tx3);margin-top:3px}
.vlog-refresh{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:650;
  color:var(--tx2);background:var(--surf2);border:1px solid var(--ln);border-radius:10px;padding:8px 13px;cursor:pointer;flex:none;
  transition:border-color .15s,color .15s}
.vlog-refresh:hover{color:var(--tx);border-color:color-mix(in srgb,var(--a1) 40%,var(--ln))}
.vlog-refresh svg{width:15px;height:15px}
.vlog-refresh.spin svg{animation:vspin .8s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.vlog-list{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.vlog-empty{color:var(--tx3);font-size:14px;text-align:center;padding:26px 10px;line-height:1.6}
.vlog-row{display:flex;align-items:flex-start;gap:12px;background:var(--surf2);border:1px solid var(--ln);
  border-radius:12px;padding:12px 14px}
.vlog-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--tx3)}
.vlog-dot.ok{background:#22c55e} .vlog-dot.dup{background:var(--tx3)} .vlog-dot.warn{background:#f59e0b} .vlog-dot.dim{background:var(--tx3)}
.vlog-main{flex:1;min-width:0}
.vlog-line1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.vlog-comm{font-weight:700;font-size:13.5px;color:var(--a1);background:color-mix(in srgb,var(--a1) 12%,transparent);
  padding:2px 9px;border-radius:999px;flex:none}
.vlog-comm.none{color:var(--tx3);background:var(--surf3)}
.vlog-text{font-size:14px;color:var(--tx);overflow-wrap:anywhere}
.vlog-line2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:6px}
.vlog-chip{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:999px}
.vlog-chip.ok{color:#15803d;background:color-mix(in srgb,#22c55e 15%,transparent)}
.vlog-chip.warn{color:#b45309;background:color-mix(in srgb,#f59e0b 16%,transparent)}
.vlog-chip.dup,.vlog-chip.dim{color:var(--tx2);background:var(--surf3)}
.vlog-meta{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}

<script>
(() => {
"use strict";

/* ═══════════════════ optional libs (never fatal) ═══════════════════ */
const G = () => window.gsap;
const reduce = () => matchMedia("(prefers-reduced-motion:reduce)").matches;

function icons(root){
  const l = window.lucide;
  if(l && l.createIcons){ try{ l.createIcons({ root: root || document.body, attrs:{ "stroke-width":2 } }); return; }catch(e){} }
  (root || document).querySelectorAll("[data-lucide]").forEach(el => {
    if(el.dataset.fbd) return;
    el.dataset.fbd = "1";
    const host = el.closest("[data-fb]");
    if(host){ host.textContent = host.dataset.fb; } else { el.remove(); }
  });
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    try{ if(document.fonts.check('1em "simple-icons"')) document.body.classList.add("si-ok"); }catch(e){}
  });
}
/* Entrance animation.
   Uses fromTo() with an explicit end state — never from(). A bare from() records
   its end value at creation time, so calling it twice on the same element makes the
   second tween animate 0 -> 0 and the content stays invisible for good.
   clearProps also strips the inline styles afterwards, so nothing can be left stranded. */
function anim(t, from){
  const g = G();
  if(!t || !g || reduce()) return;
  try{
    const els = typeof t === "string" ? document.querySelectorAll(t) : t;
    if(!els || (els.length === 0 && !els.nodeType)) return;
    g.killTweensOf(els);
    g.set(els, { clearProps:"opacity,transform" });
    const start = Object.assign({}, from);
    const end = { opacity:1, x:0, y:0, scale:1, duration:.4, ease:"power3.out",
                  overwrite:"auto", clearProps:"opacity,transform" };
    ["duration","ease","stagger","delay"].forEach(k => {
      if(start[k] !== undefined){ end[k] = start[k]; delete start[k]; }
    });
    g.fromTo(els, start, end);
    // Safety net: visibility must never depend on the animation finishing.
    // A backgrounded tab pauses requestAnimationFrame, which would otherwise leave
    // content stuck at opacity 0. Stripping the inline styles reveals it regardless.
    setTimeout(() => { try{ g.set(els, { clearProps:"opacity,transform" }); }catch(e){} }, 1600);
  }catch(e){}
}

/* ═══════════════════ constants ═══════════════════ */
/* Only the platforms this board actually watches. platform() below falls back gracefully for any
   id not here, so adding a channel on a new platform still renders — add its row here for the real
   colour and icon. */
const DEF_PLATFORMS = [
  { id:"youtube",   name:"YouTube",     color:"#ff0033", icon:"si:youtube" },
  { id:"telegram",  name:"Telegram",    color:"#229ed9", icon:"si:telegram" },
  { id:"x",         name:"X (Twitter)", color:"#16181c", icon:"si:x" },
  { id:"facebook",  name:"Facebook",    color:"#1877f2", icon:"si:facebook" },
  { id:"instagram", name:"Instagram",   color:"#e1306c", icon:"si:instagram" },
  { id:"tiktok",    name:"TikTok",      color:"#00b8c4", icon:"si:tiktok" },
  { id:"tgbot",     name:"Telegram bot", color:"#229ed9", icon:"si:telegram" },
  { id:"viber",     name:"Viber",       color:"#7360f2", icon:"si:viber" },
];
const LKEY = "orghub.v1";

const blank = () => ({
  settings:{ a1:"#5b6bff", a2:"#a855f7", theme:"dark", platforms:DEF_PLATFORMS.map(p => ({ ...p })) },
});

/* ═══════════════════ the channels this dashboard watches ═══════════════════
   Hardcoded on purpose. This is a single-team daily-check board, not a directory anyone edits from
   the browser — so the channels live in code, reviewed and version-controlled, and a new one is
   added here (a line below) rather than through an admin UI that could put a typo into production.
   The daily check reads every one of these through the same pipeline as before; the report groups
   them by language, so `lang` is what pairs the VN and EN sides of each drop. */
const SPORTSFC = {
  id: "sportsfc", name: "SportsFC",
  socials: [
    /* ytChannelId is the UC… id the YouTube API actually takes; a handle has to be looked up to
       reach it. Pinned here because the lookup is the one step that can fail on its own, and
       because skipping it saves a quota unit on every run. */
    { id:"yt-vn",   platform:"youtube",   url:"https://youtube.com/@SportsFC-vn",   handle:"@SportsFC-vn",   note:"vietnamese", ytChannelId:"UCOn89EhBv7qavXWvXFKw1FA" },
    { id:"yt-fans", platform:"youtube",   url:"https://youtube.com/@sportsfc_fans", handle:"@sportsfc_fans", note:"english",    ytChannelId:"UCbqnwmEMgqGH2WQ-UpbX2lA" },
    { id:"tg-vn",   platform:"telegram",  url:"https://t.me/sportsfc_vn",           handle:"sportsfc_vn",    note:"vietnamese" },
    { id:"tg-fans", platform:"telegram",  url:"https://t.me/sportsfc_fans",         handle:"sportsfc_fans",  note:"english" },
    { id:"x-vn",    platform:"x",         url:"https://x.com/Sportsfcvn",           handle:"Sportsfcvn",     note:"vietnamese" },
    { id:"fb-vn",   platform:"facebook",  url:"https://facebook.com/sportsfc.vn",   handle:"sportsfc.vn",    note:"vietnamese" },
    { id:"fb-fans", platform:"facebook",  url:"https://facebook.com/Sportsfc.fans", handle:"Sportsfc.fans",  note:"english" },
    { id:"ig-vn",   platform:"instagram", url:"https://instagram.com/sportsfc.vn",  handle:"sportsfc.vn",    note:"vietnamese" },
    { id:"ig-fans", platform:"instagram", url:"https://instagram.com/sportsfc.fans",handle:"sportsfc.fans",  note:"english" },
    { id:"tt-vn",   platform:"tiktok",    url:"https://www.tiktok.com/@sportsfc.fans", handle:"sportsfc.fans", note:"vietnamese" },
    { id:"tg-bot-vn", platform:"tgbot",   url:"https://t.me/SportsfcBot",              handle:"SportsfcBot",   note:"vietnamese" },
    { id:"vb-vn",   platform:"viber",     url:"https://invite.viber.com/?g2=AQBb1E9bG9aYOFaoK6NCZWomB5NyKXRWW9B%2B88qnMHECatqiPo6UvpuEjWAoMEHN", handle:"Sportsfc.vn",   note:"vietnamese" },
    { id:"vb-fans", platform:"viber",     url:"https://invite.viber.com/?g2=AQBYisJhU5NX0laoK25C7uTANpWbuOE7yZ5xBjKrXwcjgcUIZdgXex9Sc%2Bi0Twir",       handle:"Sportsfc.fans", note:"english" },
  ],
  websites: [], tags: [],
};

/* ═══════════════════ state ═══════════════════ */
let state = blank();
let cloud = { mode:"local", configured:false, updatedAt:null, saving:false, error:null };
let booting = true;

/* Settings are only theme + accent colours + the platform palette now (the channel list is
   hardcoded, so there is nothing else to carry). Merge whatever was saved over the defaults, then
   make sure every watched platform has an icon and is present. */
function normalize(d){
  const b = blank();
  const st = { settings:{ ...b.settings, ...((d && d.settings) || {}) } };
  st.settings.platforms = (st.settings.platforms || []).map(p => {
    const def = DEF_PLATFORMS.find(x => x.id === p.id);
    return { ...p, icon:p.icon || (def ? def.icon : "") };
  });
  if(!st.settings.platforms.length) st.settings.platforms = b.settings.platforms;
  const seen = new Set(st.settings.platforms.map(p => p.id));
  for(const dp of DEF_PLATFORMS) if(!seen.has(dp.id)) st.settings.platforms.push({ ...dp });
  return st;
}
const readLocal  = () => { try{ return normalize(JSON.parse(localStorage.getItem(LKEY) || "null")); }catch(e){ return blank(); } };
const writeLocal = () => { try{ localStorage.setItem(LKEY, JSON.stringify(state)); }catch(e){} };
const adminKey   = () => sessionStorage.getItem("orghub.key") || "";

/* ═══════════════════ cloud layer ═══════════════════ */
/* The settings row is read-only from the dashboard now — there is no directory to edit, so nothing
   writes it back. pull() only reports the storage mode (local vs shared) and brings the shared
   settings (theme, accent) across. The shared daily-check REPORT has its own read/write below. */
async function pull(){
  const r = await fetch("api/data", { cache:"no-store" });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "read failed");
  cloud.configured = !!j.configured;
  if(j.configured){
    cloud.mode = "cloud"; cloud.updatedAt = j.updatedAt || null;
    state = normalize(j.data);
  }else{
    cloud.mode = "local"; state = readLocal();
  }
}

/* ═══════════════════ helpers ═══════════════════ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function safeUrl(u){
  const s = String(u || "").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return "";
  return "https://" + s.replace(/^\/+/, "");
}
function pretty(u){
  try{ const x = new URL(safeUrl(u)); return (x.host.replace(/^www\./, "") + x.pathname).replace(/\/$/, ""); }
  catch(e){ return String(u || ""); }
}
const platform = id => state.settings.platforms.find(p => p.id === id) ||
  { id:"other", name:"Other channel", color:"#64748b", icon:"lucide:at-sign" };

function initials(n){
  const p = String(n || "?").trim().split(/\s+/).filter(Boolean);
  return (((p[0] || "?")[0]) + ((p[1] || "")[0] || "")).toUpperCase();
}

function iconOf(spec, fallback){
  const s = String(spec || "");
  if(s.startsWith("si:"))     return `<span class="ini">${esc(fallback)}</span><i class="si si-${esc(s.slice(3))}"></i>`;
  if(s.startsWith("lucide:")) return `<i data-lucide="${esc(s.slice(7))}"></i>`;
  return `<span class="ini" style="display:block">${esc(fallback)}</span>`;
}
let tT;
function toast(msg, ic){
  const t = document.getElementById("toast");
  t.innerHTML = `<i data-lucide="${esc(ic || "check")}"></i><span>${esc(msg)}</span>`;
  icons(t); t.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 2600);
}
function copy(txt, msg){
  const done = () => toast(msg || "Copied", "copy");
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).then(done, fb);
  fb();
  function fb(){
    const a = document.createElement("textarea");
    a.value = txt; a.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Copy failed", "triangle-alert"); }
    a.remove();
  }
}
const wireLogos = root => root.querySelectorAll(".lg img").forEach(img => {
  img.addEventListener("error", () => { img.style.display = "none"; }, { once:true });
  img.addEventListener("load", () => {
    // favicon services return a 16px placeholder for unknown domains — keep the initials then
    if(img.naturalWidth && img.naturalWidth <= 16) img.style.display = "none";
    else { const fb = img.parentNode.querySelector(".fb"); if(fb) fb.style.display = "none"; }
  }, { once:true });
});

/* ═══════════════════ modal ═══════════════════ */
const veil = document.getElementById("veil"), mo = document.getElementById("mo");
let onEsc = null, onVeil = null;

function openModal(html, opt){
  opt = opt || {};
  mo.className = "mo" + (opt.wide ? " w" : "");
  mo.innerHTML = html;
  veil.classList.add("on");
  icons(mo); wireLogos(mo);
  anim(mo, { y:14, scale:.975, opacity:0, duration:.32, ease:"back.out(1.5)" });
  mo.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  const form = mo.querySelector("form");
  if(form && opt.onSubmit) form.onsubmit = e => { e.preventDefault(); opt.onSubmit(form); };
  const sel = opt.focus === null ? null : (opt.focus || "input,select,textarea");
  const f = sel && mo.querySelector(sel);
  if(f) setTimeout(() => f.focus(), 60);
  onEsc = onVeil = closeModal;
}
function closeModal(){ veil.classList.remove("on"); mo.innerHTML = ""; onEsc = onVeil = null; }
veil.onclick = e => { if(e.target === veil && onVeil) onVeil(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && onEsc) return onEsc();
});
const X = `<button class="b g i" data-close data-fb="X"><i data-lucide="x"></i></button>`;
function confirmBox(title, body, danger){
  danger = danger !== false;
  return new Promise(res => {
    openModal(`
      <div class="mh"><h3><i data-lucide="${danger ? "triangle-alert" : "circle-help"}"></i>${esc(title)}</h3>${X}</div>
      <div class="mb"><div style="color:var(--tx2);line-height:1.6">${body}</div></div>
      <div class="mf"><button class="b" data-close>Cancel</button>
        <button class="b ${danger ? "d" : "p"}" id="y">${danger ? "Yes, delete" : "Continue"}</button></div>`,
      { focus:"#y" });
    mo.querySelector("#y").onclick = () => { closeModal(); res(true); };
    onEsc = onVeil = () => { closeModal(); res(false); };
  });
}

/* ═══════════════════ daily check ═══════════════════
   Answers one question: did today's content reach every channel?

   Post data arrives from two places — api/collect for the channels a server can read (YouTube,
   Telegram, X, and Viber via the phone forwarder), and the browser extension for Facebook and
   Instagram (and X as a fallback, when a datacenter IP is refused what the browser's own IP can
   still fetch). Both land in the same store.

   That store lives in localStorage first, and — when cloud storage is configured — is mirrored to
   a shared Supabase row (api/report) so a check run on one device is the same "today" every other
   device sees. localStorage stays the fallback: an offline moment or an unconfigured deployment
   loses nothing, the report is simply not shared until the cloud is back.

   Runs accumulate. Each source returns only its most recent posts (Telegram ~20, YouTube 15,
   Instagram ~12, X as few as 3 and rarely more than ~10), so merging on every run builds a
   history none of them offer on their own. */
const CKEY = "orghub.checks";
const BRUN = "orghub.browserRun";       // handoff slot the extension writes into

let checks = { posts:{}, counts:{}, captions:{}, meta:{}, ytIds:{}, confirms:{}, tz:7, win:15,
               window:"today", date:null, maxPer:4, lastRun:null };
try{
  const c = JSON.parse(localStorage.getItem(CKEY) || "null");
  if(c && typeof c === "object") checks = { ...checks, ...c };
}catch(e){}
let reportUpdatedAt = null;          // instant the shared report row was last stored (concurrency)
let reportPushT = null;              // debounce handle for the cloud push

/* localStorage FIRST, always — that is the copy that survives an offline moment or an unconfigured
   deployment. Then, if cloud storage is on, share it so every other device sees the same report. */
const saveChecks = () => {
  try{ localStorage.setItem(CKEY, JSON.stringify(checks)); }catch(e){}
  pushReport();
};

/* Boot-time read of the shared report: a check someone ran on another device becomes visible here.
   Cloud is the source of truth for the shared fields; an empty cloud row leaves the local copy
   untouched. Never fatal — a failure just means this browser shows what it already had. */
async function pullReport(){
  if(cloud.mode !== "cloud") return;
  try{
    const r = await fetch("api/report", { cache:"no-store" });
    const j = await r.json();
    if(j && j.ok && j.data && typeof j.data === "object"){
      checks = { ...checks, ...j.data };
      reportUpdatedAt = j.updatedAt || null;
      saveLocalChecksOnly();                       // mirror the shared copy into localStorage too
    }
  }catch(e){ /* offline / not configured — the local copy stands */ }
}
const saveLocalChecksOnly = () => { try{ localStorage.setItem(CKEY, JSON.stringify(checks)); }catch(e){} };

/* Share the report after a check. Debounced, so the burst of saveChecks() a single run fires
   collapses into one write. Because localStorage already holds the copy, a failed push is silent:
   the next save retries and the browser never loses anything. On a 409 another device ran the
   check meanwhile — take theirs rather than clobber it. */
function pushReport(){
  if(cloud.mode !== "cloud") return;
  clearTimeout(reportPushT);
  reportPushT = setTimeout(async () => {
    try{
      const r = await fetch("api/report", {
        method:"PUT",
        headers:{ "Content-Type":"application/json", "x-admin-key":adminKey() },
        body:JSON.stringify({ data:checks, baseUpdatedAt:reportUpdatedAt })
      });
      const j = await r.json().catch(() => ({}));
      if(r.status === 409){ await pullReport(); render(); return; }
      if(j && j.ok && j.updatedAt) reportUpdatedAt = j.updatedAt;
    }catch(e){ /* stays in localStorage; the next save will try again */ }
  }, 400);
}

function mergePosts(channelId, incoming){
  const have = checks.posts[channelId] || [];
  const seen = new Set(have.map(p => p.externalId));
  const add = (incoming || []).filter(p => p.externalId && p.ts && !seen.has(p.externalId));
  if(!add.length) return 0;
  /* newest first, and capped so one busy channel cannot grow the store without bound */
  checks.posts[channelId] = [...have, ...add]
    .sort((a, b) => new Date(b.ts) - new Date(a.ts)).slice(0, 400);
  return add.length;
}

/* ── language ──────────────────────────────────────────────────────────────
   Language lives in the channel's free-text note and is typo-prone ("chaina"), so match
   loosely onto ISO codes — otherwise a misspelling silently splits a language group. */
const LANGS = [["vi", /viet|\bvn\b|tiếng|tieng/i], ["th", /thai|\bth\b/i],
               ["zh", /chin|chai|\bcn\b|中文|mandarin/i], ["en", /eng|\ben\b/i]];
function normLang(s){
  const t = String(s || "").trim();
  if(!t) return "";
  for(const [code, re] of LANGS) if(re.test(t)) return code;
  return t.toLowerCase().slice(0, 12);
}

/* ── time ──────────────────────────────────────────────────────────────────
   "Which day was this posted" has to be answered in one fixed zone, or the VN, TH and CN
   channels drop the same content into different buckets. Default UTC+7 (ICT). */
const contentDate = (ts, tz) => new Date(new Date(ts).getTime() + (tz || 0) * 3600e3)
  .toISOString().slice(0, 10);
const hhmm = (ts, tz) => new Date(new Date(ts).getTime() + (tz || 0) * 3600e3)
  .toISOString().slice(11, 16);
/* a span of minutes, said the way a person would say it */
const fmtGap = m => m >= 1440 ? Math.round(m / 1440) + "d"
  : m >= 60 ? Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : "")
  : m + "m";

/* ── one post per piece of content ───────────────────────────────────────────
   Two readers can hand the same post back under different ids. Instagram is the case that bit us:
   the server API keys a reel by its numeric id (permalink /p/CODE), the extension by its shortcode
   (permalink /reel/CODE) — same reel, two ids, so mergePosts (which de-dupes by id) kept both. A
   channel then counted 4 for a day it posted 2, which inflated the expected target and made every
   OTHER channel read as "2 missing" on a day nothing was actually missing.

   So collapse a channel's posts to one per piece of content before counting. A substantial caption
   at the same minute is the same content whichever reader found it — that is the signature used.
   When there is too little text to be sure, the post's own id is kept as the key instead, so two
   genuinely distinct short posts are never merged into one. */
function contentKey(p){
  const min = p && p.ts ? new Date(p.ts).toISOString().slice(0, 16) : "";
  const txt = String((p && p.text) || "")
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/[^\p{L}\p{N}]+/gu, " ").trim().toLowerCase().slice(0, 50);
  if(txt.length >= 12) return "c:" + min + "|" + txt;      // same words, same minute → same content
  return "i:" + ((p && p.externalId) || min);              // too little text — trust the id, don't merge
}
function dedupePosts(list){
  const seen = new Map();
  for(const p of (list || [])) { const k = contentKey(p); if(!seen.has(k)) seen.set(k, p); }
  return [...seen.values()];
}

/* ── slots ─────────────────────────────────────────────────────────────────
   The same reel lands on each channel a minute or two apart, while separate drops are hours
   apart, so a new slot starts wherever the gap to the previous post exceeds the window.
   Single-linkage rather than a fixed grid: a grid splits any slot that straddles a boundary. */
function clusterSlots(posts, winMin){
  const gap = (winMin || 15) * 60e3;
  const sorted = [...posts].sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const out = [];
  for(const p of sorted){
    const last = out[out.length - 1];
    if(last && new Date(p.ts) - new Date(last.last) <= gap){ last.posts.push(p); last.last = p.ts; }
    else out.push({ first:p.ts, last:p.ts, posts:[p] });
  }
  return out;
}

/* ── language of a caption ──────────────────────────────────────────────────
   Catches the mistake a count can never catch: the right number of posts, on the right channel,
   in the wrong language. A Vietnamese reel on the English channel counts as delivered and reads
   as healthy, so the caption has to be read.

   Vietnamese is unusually easy to be sure about. đ ă ơ ư exist in no other Latin-script
   language, so a single one settles it. Tone marks alone are not enough — "Andrés Iniesta" in an
   English caption carries an acute accent, and counting that as Vietnamese would flag correct
   posts. Verified against 40 real captions from both channels: 40 right, 0 wrong. */
const VN_UNIQUE = /[đĐăĂơƠưƯ]/g;
const VN_TONES = /[àáảãạầấẩẫậằắẳẵặèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵ]/gi;
const VN_WORDS = /\b(và|của|không|người|được|những|trong|cho|với|các|là|có|để|này|khi|một|đã|sẽ|từ|như|trận|xem|ngay|bóng|đá|cầu|thủ|huyền|thoại|miễn|phí|câu|lạc|bộ|hâm|mộ|nhất|rất|thể|sự|nghiệp|cuộc|tranh|luận|tuổi|tác|chỉ|con|số|đến|nên|bàn|thắng|mùa|giải|đấu|trường|thời|đại)\b/gi;
const EN_WORDS = /\b(the|and|for|with|this|that|your|you|are|our|from|all|new|watch|now|free|club|fans|match|his|her|was|were|has|have|one|two|three|four|five|when|what|who|how|but|not|more|most|just|about|into|over|after|before|only|than|then|them|they|their|there|been|being|would|could|should|will|can|did|does|goal|goals|team|game|season|player|players|legend|legends|career|careers|era|eras|question|choice|generation|generations|icons?|nation|whole|another|different|same|stage|number|age)\b/gi;
const RX_THAI = /[฀-๿]/;
const RX_CJK = /[㐀-䶿一-鿿]/;
const hits = (s, re) => (s.match(re) || []).length;

function detectLang(text){
  const t = String(text || "");
  /* Drop URLs, hashtags and handles first. A short-link slug is not language, and hashtags are
     usually written in English even on a Vietnamese post — leaving them in tilts every caption
     toward English. */
  const body = t.replace(/https?:\/\/\S+/g, " ").replace(/#[\wÀ-ỹ]+/g, " ")
                .replace(/@[\w.]+/g, " ").trim();
  if(body.replace(/[^A-Za-zÀ-ỹ฀-๿一-鿿]/g, "").length < 4)
    return { lang:"", why:"too little text to tell" };

  if(RX_THAI.test(body)) return { lang:"th", why:"Thai script" };
  if(RX_CJK.test(body))  return { lang:"zh", why:"Chinese characters" };

  const letters = body.replace(/[^A-Za-zÀ-ỹ฀-๿一-鿿]/g, "").length || 1;
  const uniq = hits(body, VN_UNIQUE), tones = hits(body, VN_TONES);
  const vnw = hits(body, VN_WORDS), enw = hits(body, EN_WORDS);
  const vnLetters = uniq + tones;                              // Vietnamese-specific letters
  const vnPct = Math.round(vnLetters / letters * 100);
  /* Vietnamese is written mostly in plain Latin letters, so "50% of the letters carry a diacritic"
     is the wrong test — real Vietnamese captions would fail it. Instead weigh the Vietnamese signal
     (its own letters + its function words) against the English one, and only call a post Vietnamese
     when that signal clearly WINS. A couple of stray accented characters in an English caption
     (a player's name, a borrowed word) no longer flip the whole post — which is what was raising a
     false ⚠ on the English fans channels. The exact counts ride out in `why` so the report can show
     precisely what was seen ("3 VN letters — 4% of the text"), at the top, next to the flag. */
  const vnScore = vnw * 3 + vnLetters, enScore = enw * 3;
  const why = `${vnw} VN word(s) + ${vnLetters} VN letter(s) (${vnPct}% of the text) vs ${enw} EN word(s)`;
  const out = extra => Object.assign({ vnPct, vnLetters, vnw, enw }, extra);

  if((vnw >= 1 || vnLetters >= 2) && vnScore > enScore) return out({ lang:"vi", why });
  if(enw >= 1 && enScore >= vnScore)                    return out({ lang:"en", why });
  if(vnLetters >= 3 && vnPct >= 12 && enw === 0)        return out({ lang:"vi", why });
  if(enw >= 2)                                          return out({ lang:"en", why });
  return out({ lang:"", why:"no clear signal" });
}

/* ── matching on what a post said ────────────────────────────────────────
   Facebook cannot be matched on time. Its HTML reaches back only a handful of posts and its
   timestamps do not cover a whole day, so a drop it did receive looks missing purely because the
   window was never fully read. What it does give reliably is the words.

   So for Facebook the question becomes: does any of its captions say the same thing as this drop?
   Compared within one language — the Vietnamese and English variants of a drop are different text
   and must not match each other, or the language check would be meaningless.

   Character trigrams, scored by containment rather than Jaccard, because Facebook clips long
   captions and appends its own "see more": a truncated caption is a subset of the original, which
   containment scores near 1 and Jaccard punishes. Measured on the real captions, a genuine match
   scores 0.84–1.00 and an unrelated post from the same day 0.09–0.21, so the threshold sits in a
   very wide gap rather than on a knife edge. */
const CONTENT_MATCH = 0.6;

function normText(s){
  return String(s || "").toLowerCase()
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/[#@][\wÀ-ỹ]+/g, " ")
    .replace(/(…|\.\.\.)?\s*(see more|xem thêm|more)\s*$/i, " ")
    .replace(/[^\p{L}\p{N}]+/gu, " ")
    .trim();
}
function trigrams(s){
  const t = " " + normText(s).replace(/\s+/g, " ") + " ";
  const g = new Set();
  for(let i = 0; i + 3 <= t.length; i++) g.add(t.slice(i, i + 3));
  return g;
}
function contentScore(a, b){
  const A = trigrams(a), B = trigrams(b);
  if(A.size < 4 || B.size < 4) return 0;
  let inter = 0;
  for(const g of A) if(B.has(g)) inter++;
  return inter / Math.min(A.size, B.size);
}

/* WORD-level caption comparison — the transparent, strict test the report shows for the channels
   whose captions we read (Facebook, Instagram). It asks a plain question anyone can check: how many
   of THIS drop's words actually appear in that channel's caption? The same post across channels
   shares nearly all of its words (players, competition, date, the whole body); a different post —
   even the next day's same-competition one — shares only a handful. So a high overlap means the
   reel went out; a low one means it did not, and the count says exactly how sure we are. Words are
   normalised (lowercased, links/punctuation dropped) and 1-character noise removed. */
function capWords(s){
  return String(s || "").toLowerCase()
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/[#@][\wÀ-ỹ]+/g, " ")
    /* Facebook clips a long caption and appends its own "see more" — that is chrome on a button,
       not something anybody wrote. normText strips it for the trigram score and this did not, so
       every truncated caption carried two words the drop could never contain. Harmless while the
       only consumer was a 60% threshold; the moment one unmatched word raises an alert, it would
       have fired on every long Facebook post and taught the reader to ignore the alert. */
    .replace(/(…|\.\.\.)?\s*(see more|xem thêm|more)\s*$/i, " ")
    .replace(/[^\p{L}\p{N}]+/gu, " ")
    .split(/\s+/).filter(w => w.length >= 2);
}
/* Facebook cuts a long caption at a fixed length before appending its "See more", and the cut
   lands mid-word about as often as not — "khoảnh" arrives as "kho". That fragment is not a word
   anybody wrote. It cost nothing while a caption only had to clear 60%, but now that every word
   has to match it would cross out captions that genuinely did go out, so a caption showing the
   truncation marker gives up its final token before being compared. */
const CLIPPED = /(…|\.\.\.)\s*(see more|xem thêm|more)?\s*$/i;

function captionOverlap(dropText, channelCaption){
  let capw = capWords(channelCaption);
  if(CLIPPED.test(String(channelCaption || "")) && capw.length) capw = capw.slice(0, -1);
  const A = [...new Set(capWords(dropText))], B = [...new Set(capw)];
  /* Compare against the SHORTER caption's words (containment), because Facebook clips long captions
     with a "see more" — the truncated text is a subset of the full one, and a subset should still
     read as the same post. A genuinely different post shares only a few words either way. */
  const small = A.length <= B.length ? A : B, bigSet = new Set(A.length <= B.length ? B : A);
  if(small.length < 3) return { ratio: 0, matched: 0, total: small.length, missing: small };
  const matched = small.filter(w => bigSet.has(w));
  return { ratio: matched.length / small.length, matched: matched.length, total: small.length,
           missing: small.filter(w => !bigSet.has(w)) };
}

/* A tick here means "this reel went out on this channel". It used to mean "60% of its words turned
   up in some caption", which is a different claim, and the gap between the two is where a post
   that never went out on sportsfc.vn came back delivered.

   So the bar is now every word. A drop is credited only when the shorter of the two texts is
   wholly contained in the longer — nothing left over, nothing unaccounted for. Anything short of
   that is a cross.

   This deliberately trades a false tick for a false cross, on the user's instruction and for a
   good reason: a cross is visible and gets checked, while a tick is never looked at again. The
   report must never claim delivery it cannot prove.

   CAPTION_NEAR no longer decides anything. It only marks a cross as CLOSE — most of the words
   matched, so it is probably the same post reworded and worth a human minute — which keeps the
   information the old threshold carried without letting it grant a tick. */
const CAPTION_NEAR = 0.6;

/* The one thing that separates two otherwise-identical templated posts is the fixture they name —
   its DATE. SportsFC captions carry it as "📅 28 August 2026" (and a kick-off time). Two posts a day
   apart share ~70% of their words but name different dates, so this is what stops yesterday's
   "EFL Cup … 27 August" caption from being credited for today's "EFL Cup … 28 August" drop. */
const MON3 = "jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec";
function fixtureDates(text){
  const out = new Set(); const t = String(text || ""); let m;
  const re = new RegExp("(\\d{1,2})\\s+(" + MON3 + ")", "gi");
  while((m = re.exec(t))) out.add(m[1] + m[2].slice(0, 3).toLowerCase());
  return out;
}
/* true when both captions name a date and NONE of them coincide → they are different fixtures */
function differentFixture(a, b){
  const A = fixtureDates(a), B = fixtureDates(b);
  if(!A.size || !B.size) return false;                    // at least one has no date → can't tell, don't block
  for(const d of A) if(B.has(d)) return false;            // a shared date → same fixture, allow
  return true;                                            // both dated, no overlap → different day's post
}
/* which channels are judged on content instead of time. X is deliberately not here even though it
   shares the "browser-hostile" reputation Facebook has — its collector reads a real per-post
   timestamp out of the profile page's own schema.org microdata, so it gets genuine instants and
   belongs on the timeline side, matched drop by drop like YouTube and Telegram, not on words. */
const matchesByContent = c => c.platform === "facebook";
/* Viber reaches us only as forwarded phone notifications: real per-post timestamps, but coverage
   of the window that cannot be depended on (a killed listener, a collapsed "3 new messages"
   bundle), and video posts that arrive as a bare "Video message" placeholder rather than a caption.
   That is the same shape as Facebook — a notification proves a post was made, its silence proves
   nothing — so Viber must never anchor a drop or accuse one of a miss. Unlike Facebook it does
   carry instants, so it folds into a drop by TIME rather than by caption: a notification inside a
   drop's window is a ✓, and no notification is "·" (not seen forwarded), never "✗". */
const foldsByTime = c => c.platform === "viber";
/* a caption is an object; runs before that stored bare strings */
const capObj = t => (t && typeof t === "object" ? t : { text:String(t || "") });

/* ── one piece of content, two clocks ──────────────────────────────────────
   Clustering on time assumes the same content reaches every channel within minutes, which is
   normally true and was true for three of this day's four drops. It is not always: one clip went
   out on eight channels at 12:42 and on X at 14:43, two hours adrift. Single-linkage put that in
   two slots, and the report then claimed five drops on a day four things were published — marking
   X missing from the first, eight channels missing from the second, and pushing a Facebook page to
   5/4 because its captions answered both halves. Every one of those was false.

   So after clustering, fold together any two slots that are one drop arriving late. Two separate
   tests must agree, because merging drops is a far stronger claim than matching a caption:

     · the channel sets must be disjoint — a channel cannot be late to a drop it already made, so
       any overlap means these are two real posts rather than one arriving twice. This alone is
       what keeps a channel that genuinely posts the same thing twice from being quietly merged.
     · the words and the identifying tokens must both match.

   That second test needs more than the trigram score Facebook is matched on. These captions are
   templated — "Liệu {team} có thể giành chiến thắng? … {n}% khả năng…" — so two entirely
   different fixtures score as high as 0.84 against each other, well above the 0.6 caption
   threshold; merging on that alone would collapse a whole day into one drop. What actually
   separates them is the handful of tokens naming the fixture: the hashtags, the percentages, the
   proper nouns. Measured across a full day of both channels, that signature scored 1.00 for every
   same-content pair and at most 0.67 for every different one — a gap of 0.33 where the trigram

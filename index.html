      /* A content-matched channel has no usable timestamps, so listing its timestamped posts
         showed a bare "18:32:07 post ?" and none of what actually matched. Show the drops it
         accounted for instead: the caption that matched, its banner, and its score. */
      const mine = r.mode === "content"
        ? r.cells.map((x, i) => {
            if(x.state !== "okc" || !x.post) return null;
            const slot = rep.slots[i];
            /* The banner only comes with a caption read from the DOM, and most arrive from the
               page's HTML instead. Rather than show nothing, borrow the drop's own artwork — every
               other channel posted the same thing — and mark it, because "this channel's picture"
               and "this drop's picture" are different claims and only one of them is verified. */
            const own = x.post.thumb || "";
            const shared = !own && slot ? (slot.posts.find(p => p.thumb) || {}).thumb : "";
            return { ...x.post, channelId:r.id, ts:slot ? slot.at : null,
                     slotTime:slot ? slot.time : "", score:x.score,
                     kind:x.post.kind || "post",
                     thumb:own || shared || "", borrowedThumb:!own && !!shared };
          }).filter(Boolean)
        : logPosts.filter(p => p.channelId === r.id);
      const sum = f => mine.reduce((n, p) => (typeof p[f] === "number" ? n + p[f] : n), 0);
      const anyViews = mine.some(p => typeof p.views === "number");
      return `<div class="dc-ch">
        <div class="dc-cht">
          <b>${esc(r.name)}</b>
          <span class="dc-pill un">${esc(r.lang || "no language")}</span>
          ${r.mode === "none"
            ? `<span class="dc-pill un">${meta.unsupported ? "not supported" : "no data"}</span>`
            : r.mode === "timefold"
              ? (() => { const conf = r.cells.filter(x=>x.state==="ok").length, mb = r.cells.filter(x=>x.state==="maybe").length, tot = rep.slots.length;
                  return `<span class="dc-pill ${mb?"short":"okc"}" title="${conf} of ${tot} drop(s) confirmed by a notification, ${mb} not seen while online (likely missing), rest assumed — repeat Viber reminders are ignored">${conf}/${tot} confirmed${mb?` · ${mb}⚠`:""}</span>`; })()
            : `<span class="dc-pill ${r.status === "ok" ? "ok" : r.status === "short" ? "short" : "sg"}">${
                r.count}${r.expected === null ? "" : "/" + r.expected}</span>`}
          ${r.suggested ? `<span class="dc-pill sg">suggested</span>` : ""}
          <span class="sp"></span>
          ${anyViews ? `<span class="dc-sn">${compact(sum("views"))} views</span>` : ""}
          ${mine.some(p => p.likes != null) ? `<span class="dc-sn">${compact(sum("likes"))} likes</span>` : ""}
        </div>
        ${r.missedAt.length ? `<div class="dc-miss">nothing at ${esc(r.missedAt.join(", "))}</div>` : ""}
        ${meta.note ? `<div class="mt" style="margin-top:5px">${esc(meta.note)}</div>` : ""}
        ${r.mode === "content" ? r.cells.map((x, i) => x.state === "miss" && rep.slots[i]
          ? `<div class="dc-miss">reel did NOT go out for the ${esc(rep.slots[i].time)} drop —
               closest caption matched ${x.match ? x.match.matched + "/" + x.match.total : Math.round((x.score || 0) * 100) + "%"} words${
               x.match && x.match.missing && x.match.missing.length
                 ? " · " + x.match.missing.length + " do NOT match: " + esc(x.match.missing.slice(0, 15).join(", ")) +
                   (x.match.missing.length > 15 ? " (+" + (x.match.missing.length - 15) + " more)" : "")
                 : ""}</div>`
          : (x.state === "okc" && rep.slots[i] && x.match
             ? `<div class="mt" style="margin-top:4px;color:var(--grn)">✓ ${esc(rep.slots[i].time)} drop — caption matched all ${x.match.total} words</div>` : "")).join("") : ""}
        ${mine.length ? `<div class="dc-plist">${mine.map(p => {
          const d = detectLang(p.text), bad = r.lang && d.lang && d.lang !== r.lang;
          const t = clean(p.text);
          /* Counts off a Facebook page arrive as the strings it printed ("1.2K"); everywhere else
             they are numbers. Show whichever came, rather than dropping the string form. */
          const stat = (v, label) => v == null || v === "" ? ""
            : `<span class="dc-sn">${esc(typeof v === "number" ? compact(v) : v)} ${label}</span>`;
          return `<div class="dc-p${bad ? " bad" : ""}">
            ${p.thumb ? `<img class="dc-th sm${p.borrowedThumb ? " borrowed" : ""}" src="${esc(p.thumb)}"
                 alt="" loading="lazy" title="${p.borrowedThumb
                   ? "this drop's artwork, taken from another channel — not read from this one"
                   : "read from this channel's own post"}">` : ""}
            <div style="min-width:0;flex:1">
              <div class="dc-pm">
                <b class="mono">${esc(p.ts ? hhmmss(p.ts, rep.tz) : (p.timeLabel || p.slotTime || "—"))}</b>
                ${p.borrowedThumb ? `<span class="dc-pill un" title="the banner shown is the drop's, not this channel's">borrowed art</span>` : ""}
                <span class="dc-pill un">${esc(p.kind || "post")}</span>
                <span class="dc-pill ${bad ? "short" : "un"}">${esc(d.lang || "?")}</span>
                ${p.score != null ? `<span class="dc-pill okc" title="caption match">≈${Math.round(p.score * 100)}%</span>` : ""}
                ${stat(p.views, "views")}${stat(p.likes, "likes")}${stat(p.reactions, "reactions")}
                ${stat(p.comments, "comments")}${stat(p.reposts, "reposts")}
                ${p.duration != null ? `<span class="dc-sn">${dur(p.duration)}</span>` : ""}
                ${p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener noreferrer"><i data-lucide="arrow-up-right"></i></a>` : ""}
              </div>
              <div class="dc-pt">${esc(t.slice(0, 220))}${t.length > 220 ? "…" : ""}</div>
            </div></div>`;
        }).join("")}</div>` : ""}
      </div>`;
    }).join("");

    /* ── manual counts ── */
    const manualRows = rep.rows.filter(r => r.mode !== "timeline");
    const manual = manualRows.length ? `
      <div class="sec-h" style="margin-top:16px"><h3><i data-lucide="pencil"></i> Counts by hand
        <span class="ct">${manualRows.length}</span></h3></div>
      <div class="dc-tw"><table class="dc"><thead><tr><th>Channel</th><th>Posts in window</th><th>How</th></tr></thead>
        <tbody>${manualRows.map(r => {
          const meta = checks.meta[r.id] || {};
          return `<tr><td class="ch">${esc(r.name)}</td>
            <td><input class="cnt${r.suggested ? " guess" : ""}" type="number" min="0" inputmode="numeric"
                  data-ci="${esc(r.id)}" value="${r.mode === "count" ? esc(r.count) : ""}"
                  placeholder="–"${meta.unsupported ? " disabled" : ""}${
                  r.suggested ? ' title="read off the page — this is a guess until you confirm it"' : ""}></td>
            <td class="mt">${esc(r.suggested ? (meta.note || "read off the page — confirm it")
                              : meta.unsupported ? "nothing can read this one" : meta.note || "")}</td></tr>`;
        }).join("")}</tbody></table></div>` : "";

    const panel = { sum:tabSum, drops:tabDrops, log:tabLog, chan:tabChan }[dcTab] || tabSum;

    openModal(`
      <div class="mh"><h3><i data-lucide="calendar-check"></i>Daily check — ${esc(o.name)}</h3>${X}</div>
      <div class="mb">
        <div class="dc-top">
          <div class="dc-bar">
            <label class="dc-fld"><span>Window</span>
              <select id="dcWindow" title="Which stretch of time to report on">
                ${WINDOWS.map(([v, l]) => `<option value="${v}"${String(checks.window || "today") === v ? " selected" : ""}>${esc(l)}</option>`).join("")}
              </select></label>
            ${String(checks.window) === "date"
              ? `<label class="dc-fld"><span>Date</span>
                   <input id="dcDate" type="date" value="${esc(checks.date || contentDate(new Date().toISOString(), Number(checks.tz) || 0))}"
                     max="${esc(contentDate(new Date().toISOString(), Number(checks.tz) || 0))}"
                     title="Which day, in the timezone chosen next to this"></label>` : ""}
            <label class="dc-fld"><span>Timezone</span>
              <select id="dcTz" title="Which timezone the times are shown in">
                ${TZS.map(([v, l]) => `<option value="${v}"${Number(checks.tz) === v ? " selected" : ""}>${esc(l)}</option>`).join("")}
              </select></label>
            <label class="dc-fld"><span>Same drop within</span>
              <select id="dcWin" title="How far apart two posts can be and still count as the same drop">
                ${[5, 10, 15, 30, 60].map(v => `<option value="${v}"${checks.win === v ? " selected" : ""}>±${v} min</option>`).join("")}
              </select></label>
            <label class="dc-fld"><span>Flag above</span>
              <select id="dcMax" title="Flag a channel that posts more than this in the window">
                ${[2, 3, 4, 5, 6, 8].map(v => `<option value="${v}"${(checks.maxPer || 4) === v ? " selected" : ""}>max ${v}</option>`).join("")}
              </select></label>
            <span class="sp"></span>
            <span class="dc-when">${
              checks.lastRun ? "collected " + new Date(checks.lastRun).toLocaleString() : "never collected"}</span>
          </div>
          <div class="dc-win">${wo.mode === "day"
            /* a whole day runs midnight to midnight, which rendered as "00:00–00:00" and read as
               an empty range; only a day still in progress has a meaningful end time */
            ? `<b>${esc(wo.date)}</b> · ${esc(dayRange(rep))}`
            : `<b>${esc(fmtWhen(rep.from, rep.tz))}</b> → <b>${esc(fmtWhen(rep.to, rep.tz))}</b>`}
            · ${esc(tzLabel(rep.tz))} · drops grouped within ±${rep.win} min</div>
        </div>

        ${sources}

        <div class="dc-tabs">${TABS.map(([k, l]) => `<button class="dc-tab${dcTab === k ? " on" : ""}"
          data-tab="${k}">${esc(l)}${k === "log" ? ` <span class="ct">${logPosts.length}</span>` : ""}${
          k === "drops" ? ` <span class="ct">${rep.slots.length}</span>` : ""}</button>`).join("")}</div>

        <div class="dc-panel">${panel}</div>
        ${dcTab === "sum" ? manual : ""}
      </div>
      <div class="mf">
        <button class="b" data-close>Close</button>
        <button class="b" id="dcDownload"><i data-lucide="download"></i> Download</button>
        <button class="b" id="dcCopy"><i data-lucide="copy"></i> Copy report</button>
        <button class="b d" id="dcClear"><i data-lucide="trash-2"></i> Delete report</button>
      </div>`, { wide:true, focus:null });
    mo.className = "mo xw";

    mo.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { dcTab = b.dataset.tab; draw(); });

    const all = mo.querySelector("#dcAll");
    all.onclick = async () => {
      all.disabled = true; all.textContent = "Running…";
      try{ await runEverything(o); } finally { draw(); }
    };
    mo.querySelector("#dcRun").onclick = async () => { await collectServer(o); absorbBrowserRun(); draw(); };
    const mg = mo.querySelector("#dcMerge");
    if(mg) mg.onclick = () => { const n = absorbBrowserRun(); draw();
      if(!n) toast("That run had nothing new in it", "info"); };

    const set = (id, key, num) => { const el = mo.querySelector(id);
      if(el) el.onchange = e => {
        checks[key] = num ? Number(e.target.value) : e.target.value; saveChecks(); draw(); }; };
    set("#dcWindow", "window"); set("#dcDate", "date");
    set("#dcTz", "tz", true); set("#dcWin", "win", true); set("#dcMax", "maxPer", true);

    mo.querySelectorAll("input.cnt").forEach(inp => {
      inp.onchange = () => {
        const day = contentDate(rep.to, checks.tz), id = inp.dataset.ci, v = inp.value.trim();
        checks.counts[day] = checks.counts[day] || {};
        if(v === "") delete checks.counts[day][id];
        else checks.counts[day][id] = { n:Math.max(0, parseInt(v, 10) || 0), source:"manual" };
        saveChecks(); draw();
      };
    });

    /* the tickable cells: unanswered → went out → did not go out → unanswered.
       Three states, not two, because "I looked and it was not there" is a different fact from
       "I have not looked yet", and only the first should ever read as a miss. */
    /* the whole row at once — the answer on a normal day */
    mo.querySelectorAll("[data-askall]").forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const id = b.dataset.askall;
        checks.confirms = checks.confirms || {};
        checks.confirms[id] = checks.confirms[id] || {};
        for(const s of rep.slots) checks.confirms[id][s.at] = true;
        saveChecks(); draw();
        toast(`${rep.slots.length} drop(s) confirmed on ${nameOf(id)}`, "check-check");
      };
    });
    mo.querySelectorAll("[data-askclear]").forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        delete (checks.confirms || {})[b.dataset.askclear];
        saveChecks(); draw();
      };
    });

    mo.querySelectorAll("td.ask").forEach(td => {
      td.onclick = () => {
        const id = td.dataset.ask, at = td.dataset.at;
        checks.confirms = checks.confirms || {};
        checks.confirms[id] = checks.confirms[id] || {};
        const cur = checks.confirms[id][at];
        if(cur === undefined) checks.confirms[id][at] = true;
        else if(cur === true) checks.confirms[id][at] = false;
        else delete checks.confirms[id][at];
        saveChecks(); draw();
      };
    });

    mo.querySelector("#dcDownload").onclick = () => downloadReportCard(rep, o, wo);

    mo.querySelector("#dcCopy").onclick = () => {
      const L = [`${o.name} — daily check`,
        wo.mode === "day"
          ? `${wo.date}  ${hhmm(rep.from, rep.tz)}–${hhmm(rep.to, rep.tz)}  (${tzLabel(rep.tz)})`
          : `${fmtWhen(rep.from, rep.tz)} → ${fmtWhen(rep.to, rep.tz)}  (${tzLabel(rep.tz)})`,
        `expected ${rep.expected === null ? "— nothing measured" : rep.expected + " post(s) per channel"}`, "",
        /* Which half reported has to be in the pasted copy too. Without it a report full of
           "no data" cannot be told apart from one where the extension was never run. */
        "SOURCES",
        `  server     ${gotFrom(srvIds)}/${srvIds.length} channel(s)` +
          (checks.lastRun ? `  last collected ${new Date(checks.lastRun).toLocaleString()}` : "  never collected"),
        `  extension  ${gotFrom(brwIds)}/${brwIds.length} channel(s)  ` +
          (extReady
            ? (extStale() ? `v${extVersion} OUTDATED — needs v${EXT_WANT}, reload it at chrome://extensions`
                          : "detected" + (extVersion ? ` v${extVersion}` : ""))
            : "NOT DETECTED — reload it at chrome://extensions") +
          (pendingN ? `  ${pendingN} run(s) waiting to be merged` : ""),
        ""];

      L.push(rep.alerts.length ? `PROBLEMS (${rep.alerts.length})` : "PROBLEMS — none");
      for(const a of rep.alerts) L.push(`  [${a.kind}] ${a.name} — ${a.text}`);

      L.push("", "COUNTS");
      for(const lg of rep.langs){
        L.push(`  [${lg === "—" ? "no language" : lg}]`);
        for(const r of rep.rows.filter(x => (x.lang || "—") === lg)){
          const meta = checks.meta[r.id] || {};
          const v = r.mode === "none"
            ? (meta.unsupported ? "not supported" : meta.dead ? "LINK DEAD" : "no data")
            : r.mode === "timefold" ? `${r.cells.filter(x=>x.state==="ok").length}/${rep.slots.length} drop(s) confirmed by a notification` +
                (r.cells.filter(x=>x.state==="maybe").length ? `, ${r.cells.filter(x=>x.state==="maybe").length} NOT SEEN while online — verify` : "") +
                ` (repeat reminders ignored)`
            : r.expected === null ? `${r.count} (no target)` : `${r.count}/${r.expected}`;
          L.push(`    ${r.status === "ok" ? "ok   " : r.status === "short" ? "SHORT" :
                        r.status === "over" ? "OVER " : r.status === "seen" ? "seen " :
                        r.status === "review" ? "CHECK" : "  -  "} ${r.name} — ${v}` +
            (r.missedAt.length ? `  (nothing at ${r.missedAt.join(", ")})` : "") +
            (r.suggested ? " [suggested]" : ""));
          /* Say how the number was arrived at, for every mode. Restricting this to "no data" rows
             hid the caption diagnostics on exactly the channels being investigated — a short
             content match needs its evidence shown just as much as an absent one. */
          if(meta.note) L.push(`            how: ${meta.note}`);
          else if(r.mode === "none" && !meta.at) L.push(`            how: never attempted`);
          if(r.mode === "content")
            L.push(`            matched on captions, word by word` +
              r.cells.map((x, i) => ` · ${rep.slots[i] ? rep.slots[i].time : i}:` +
                (x.match && x.match.total
                  ? (x.state === "okc"
                      ? `all ${x.match.total} words ✓`
                      : `${x.match.matched}/${x.match.total} words — NOT sent` +
                        (x.match.missing && x.match.missing.length
                          ? ` (${x.match.missing.length} unmatched: ${x.match.missing.slice(0, 15).join(", ")})` : ""))
                  : x.state)).join(""));
          if(meta.routeLog && r.mode !== "timeline")
            for(const x of meta.routeLog)
              L.push(`            route ${(x.url || "?").replace(/^https?:\/\//, "")} → ` +
                `${x.status || x.error || "?"}` +
                (x.bytes != null ? ` ${x.bytes}b` : "") +
                (x.stamps != null ? ` ${x.stamps} stamp(s) ${x.ids} id(s)` : "") +
                (x.markers && Object.keys(x.markers).length ? ` ${JSON.stringify(x.markers)}` : "") +
                (x.login ? " LOGIN-WALL" : "") + (x.rejected ? ` rejected: ${x.rejected}` : ""));
        }
      }

      L.push("", "EVERY POST, EXACT TIME");
      for(const p of logPosts){
        const c = chanOf(p.channelId), d = detectLang(p.text);
        const bad = c.lang && d.lang && d.lang !== c.lang;
        L.push(`  ${hhmmss(p.ts, rep.tz)}  ${(c.name || "").padEnd(26)} ${(d.lang || "?").padEnd(3)}` +
          `${bad ? " WRONG-LANG" : "          "} ${(p.kind || "").padEnd(8)}` +
          ` views=${String(nn(p.views)).padStart(6)} likes=${String(nn(p.likes)).padStart(5)}` +
          ` len=${String(nn(p.duration)).padStart(4)}s`);
        const t = clean(p.text);
        if(t) L.push(`            "${t.slice(0, 100)}${t.length > 100 ? "…" : ""}"`);
        if(p.permalink) L.push(`            ${p.permalink}`);
      }

      L.push("", "DROPS");
      for(const s of rep.slots){
        L.push(`  ${hhmmss(s.at, rep.tz)}  ${s.present.length} channel(s)  ${s.kinds.join(",")}` +
          (s.missing.length ? `  MISSING: ${s.missing.map(nameOf).join(", ")}` : "") +
          /* a drop that reached a channel hours late is the one thing a pasted report would
             otherwise lose entirely — the times below say it, but only if you do the arithmetic */
          ((s.late || []).length
            ? `  LATE: ${s.late.map(l => `${nameOf(l.id)} +${fmtGap(l.mins)}`).join(", ")}` : ""));
        for(const p of s.posts.slice().sort((a, b) => new Date(a.ts) - new Date(b.ts))){
          const l = (s.late || []).find(x => x.id === p.channelId);
          L.push(`        ${hhmmss(p.ts, rep.tz)}  ${nameOf(p.channelId)}` +
            (l ? `  (+${fmtGap(l.mins)} behind)` : ""));
        }
      }
      copy(L.join("\n"), "Report copied");
    };

    mo.querySelector("#dcClear").onclick = async () => {
      if(!await confirmBox("Delete this report?",
        "Every collected post and hand-entered count is removed from this browser, so the next Collect starts clean. The directory itself is untouched.")) return;
      /* confirms are kept, like ytIds: they are answers a person gave about drops, not collected
         data, and re-collecting is no reason to make somebody tick them all again */
      checks = { posts:{}, counts:{}, captions:{}, meta:{}, ytIds:checks.ytIds,
                 confirms:checks.confirms || {}, tz:checks.tz, win:checks.win,
                 window:checks.window, date:checks.date, maxPer:checks.maxPer, lastRun:null };
      try{ localStorage.removeItem(BRUN); }catch(e){}
      saveChecks(); draw(); toast("Report deleted — collect again for a fresh one", "trash-2");
    };
  };
  draw();
}

/* ═══════════════════ render ═══════════════════ */
function paintSync(){
  const el = document.getElementById("sync");
  if(!el) return;
  let cls = "sync", txt = "Local only", tip = "Data is saved in this browser only";
  if(cloud.saving){ cls += " busy"; txt = "Saving…"; tip = "Writing to the cloud"; }
  else if(cloud.error){ cls += " warn"; txt = "Not saved"; tip = cloud.error; }
  else if(cloud.mode === "cloud"){ cls += " on"; txt = "Cloud"; tip = "Shared across all devices" + (cloud.updatedAt ? " · saved " + new Date(cloud.updatedAt).toLocaleString() : ""); }
  else{ cls += " warn"; }
  el.className = cls; el.title = tip;
  el.querySelector(".lbl").textContent = txt;
}

function render(){
  const s = state.settings;
  document.documentElement.dataset.theme = s.theme || "dark";
  document.documentElement.style.setProperty("--a1", s.a1);
  document.documentElement.style.setProperty("--a2", s.a2);
  document.title = "SportsFC — Daily check";
  const ttl = document.getElementById("ttl"); if(ttl) ttl.textContent = "SportsFC";
  paintSync();

  const o = SPORTSFC;
  const app = document.getElementById("app");

  /* channels grouped by language — the same pairing the report uses (VN drop ↔ EN drop) */
  const groups = {};
  for(const c of o.socials){ const lg = normLang(c.note) || "other"; (groups[lg] = groups[lg] || []).push(c); }
  const LG = { vi:"Vietnamese", en:"English", th:"Thai", zh:"Chinese", other:"Other" };
  const ORDER = ["vi","en","th","zh","other"];
  const langs = Object.keys(groups).sort((a,b) => ORDER.indexOf(a) - ORDER.indexOf(b));

  const chanCard = c => {
    const p = platform(c.platform), u = safeUrl(c.url);
    return `<a class="ch-card" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">
      <span class="chip" style="--c:${esc(p.color)}">${iconOf(p.icon, initials(p.name))}</span>
      <span class="ch-meta">
        <span class="ch-name">${esc(p.name)}</span>
        <span class="ch-handle">${esc(c.handle || pretty(u))}</span>
      </span>
      <i class="ch-go" data-lucide="arrow-up-right"></i>
    </a>`;
  };

  app.innerHTML = `
    <div class="dash">
      <section class="hero-card">
        <div class="hero-eyebrow"><span class="dot-live"></span> Daily check</div>
        <h1 class="hero-h">Did today's content reach<br>every channel?</h1>
        <p class="hero-p">${o.socials.length} channels, ${langs.length} languages — checked drop by drop.
          See exactly which post landed where, which is missing, and which arrived late.</p>
        <div class="hero-cta">
          <button class="b p xl" id="runDaily"><i data-lucide="calendar-check"></i> Run daily check</button>
          <span class="hero-when" id="heroWhen"></span>
        </div>
      </section>

      <section class="pipe" id="pipeHealth" aria-live="polite">
        <span class="pipe-dot idle"></span>
        <div class="pipe-main">
          <div class="pipe-eyebrow">Viber pipeline monitor</div>
          <div class="pipe-sub" id="pipeSub">checking phone monitor…</div>
        </div>
        <div class="pipe-chans" id="pipeChans"></div>
      </section>

      <section class="channels">
        <div class="channels-h">Channels watched <span class="ct">${o.socials.length}</span></div>
        ${langs.map(lg => `
          <div class="ch-group">
            <div class="ch-group-h">${esc(LG[lg] || lg)} <span class="ct">${groups[lg].length}</span></div>
            <div class="ch-grid">${groups[lg].map(chanCard).join("")}</div>
          </div>`).join("")}
      </section>

      <section class="vlog" id="vlog">
        <div class="vlog-head">
          <div class="vlog-titles">
            <div class="vlog-title"><span class="vlog-live"></span> Viber live log</div>
            <div class="vlog-sub" id="vlogSub">everything your phone forwards · updates on its own</div>
          </div>
          <button class="vlog-refresh" id="vlogRefresh" title="Refresh now"><i data-lucide="refresh-cw"></i> Refresh</button>
        </div>
        <div class="vlog-list" id="vlogList"><div class="vlog-empty">Loading…</div></div>
      </section>
    </div>`;

  const when = document.getElementById("heroWhen");
  if(when) when.textContent = checks.lastRun ? "last run " + new Date(checks.lastRun).toLocaleString() : "not run yet";
  document.getElementById("runDaily").onclick = () => dailyCheckModal(o);

  icons(app);
  pollHealth();
  pollNotifLog();
  const vr = document.getElementById("vlogRefresh");
  if(vr) vr.onclick = () => { vr.classList.add("spin"); pollNotifLog(true); };
  if(!booting){
    anim(".hero-card", { y:16, opacity:0, duration:.4 });
    anim(".ch-card", { y:14, opacity:0, stagger:.02, duration:.34 });
  }
}

/* ── Viber live log ────────────────────────────────────────────────────────
   A real-time feed of exactly what the phone forwards for Viber — polled every few seconds so it
   stays current on its own, with a manual refresh as a fallback. Shows each notification's words,
   which community it hit, when the phone sent it, and what the tool did with it. */
let vlogTimer = null;
const VLOG_OUTCOME = {
  "stored":                      { cls:"ok",   label:"stored" },
  "duplicate — already have this one": { cls:"dup", label:"duplicate" },
  "skipped — bundle / no caption":     { cls:"warn", label:"bundle / no caption" },
  "ignored — not a watched community": { cls:"warn", label:"not a watched community" },
};
async function pollNotifLog(manual){
  clearTimeout(vlogTimer);
  try{
    const j = await (await fetch("api/notiflog", { cache:"no-store" })).json();
    renderNotifLog(j && j.log ? j.log : []);
  }catch(e){ /* keep whatever is shown */ }
  const vr = document.getElementById("vlogRefresh"); if(vr) vr.classList.remove("spin");
  vlogTimer = setTimeout(pollNotifLog, 5000);          // real-time-ish, self-updating
}
function renderNotifLog(log){
  const list = document.getElementById("vlogList"); if(!list) return;
  const sub = document.getElementById("vlogSub");
  if(sub) sub.textContent = log.length
    ? `${log.length} recent · latest ${new Date(log[0].at).toLocaleTimeString()}`
    : "everything your phone forwards · updates on its own";
  if(!log.length){
    list.innerHTML = `<div class="vlog-empty">No Viber notifications yet. When your phone forwards one, it appears here within seconds.</div>`;
    return;
  }
  const commName = id => (id || "").replace(/^viber:/, "") || "—";
  list.innerHTML = log.map(e => {
    const o = VLOG_OUTCOME[e.outcome] || { cls:"dim", label:e.outcome || "seen" };
    const at = new Date(e.at);
    const recv = at.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });
    const rel = agoStr(Math.max(0, Math.round((Date.now() - at.getTime()) / 1000)));
    const sent = e.postedAt ? String(e.postedAt) : "";
    const sentNice = e.ts ? new Date(e.ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }) : "";
    return `<div class="vlog-row">
      <span class="vlog-dot ${o.cls}"></span>
      <div class="vlog-main">
        <div class="vlog-line1">
          ${e.community ? `<span class="vlog-comm">${esc(commName(e.community))}</span>` : `<span class="vlog-comm none">no match</span>`}
          <span class="vlog-text">${esc(e.text || "(no text)")}</span>
        </div>
        <div class="vlog-line2">
          <span class="vlog-chip ${o.cls}">${esc(o.label)}</span>
          ${sentNice ? `<span class="vlog-meta">sent ${esc(sentNice)}</span>` : ""}
          <span class="vlog-meta">received ${esc(recv)}</span>
        </div>
      </div>
      <span class="vlog-ago">${esc(rel)}</span>
    </div>`;
  }).join("");
  icons(list);
}

/* ── phone / pipeline monitor ──────────────────────────────────────────────
   A live read of /api/health: is the phone's forwarder still touching the server, and is each
   watched Viber community receiving posts. Polled while the tab is open, so a listener that dies
   surfaces here — with WHEN it went quiet — instead of failing silently. */
let healthTimer = null;
function agoStr(sec){
  if(sec == null) return "";
  if(sec < 60) return "just now";
  const m = Math.round(sec / 60); if(m < 60) return m + "m ago";
  const h = Math.floor(m / 60); if(h < 24) return h + "h " + (m % 60 ? (m % 60) + "m " : "") + "ago";
  return Math.round(h / 24) + "d ago";
}
async function pollHealth(){
  clearTimeout(healthTimer);
  try{ paintHealth(await (await fetch("api/health", { cache:"no-store" })).json()); }
  catch(e){ paintHealth(null); }
  healthTimer = setTimeout(pollHealth, 45000);          // keep it live while the tab is open
}
function paintHealth(h){
  const box = document.getElementById("pipeHealth"); if(!box) return;
  const dot = box.querySelector(".pipe-dot");
  const sub = document.getElementById("pipeSub");
  const chans = document.getElementById("pipeChans");
  if(chans) chans.innerHTML = "";

  if(!h || !h.ok){
    dot.className = "pipe-dot idle";
    sub.innerHTML = "monitor unavailable — could not reach the server";
    return;
  }
  /* keep the heartbeat log where reconcile can read it: it is what tells a real Viber miss (phone
     was online at the drop) from an unverifiable one (phone was offline then) */
  checks.beats = Array.isArray(h.beats) ? h.beats : [];
  const age = h.ageSeconds;
  if(h.lastSeen == null){
    dot.className = "pipe-dot idle";
    sub.innerHTML = "<b>No signal yet</b> — send a test message, or add the heartbeat rule";
    box.title = "No forwarded notification or heartbeat received yet";
  }else if(age != null && age < 35 * 60){             // heartbeat ~15m, but Android Doze can delay it
                                                       // to ~20m; 35m tolerates one missed ping so
                                                       // normal drift never flickers to false "offline"
    dot.className = "pipe-dot ok";
    sub.innerHTML = "<b>Phone connected</b> · last seen " + esc(agoStr(age));
    box.title = "Last heard from the phone: " + new Date(h.lastSeen).toLocaleString();
  }else{
    dot.className = "pipe-dot bad";
    sub.innerHTML = "<b>Phone offline</b> · last seen " + esc(agoStr(age)) +
      ' <span class="pipe-at">(' + esc(new Date(h.lastSeen).toLocaleString()) + ')</span>';
    box.title = "The forwarder stopped touching the server at " + new Date(h.lastSeen).toLocaleString();
  }

  if(chans) chans.innerHTML = (h.channels || []).map(c => {
    const t = c.lastPost ? (Date.now() - new Date(c.lastPost).getTime()) / 1000 : null;
    const cls = (t != null && t < 48 * 3600) ? "on" : (c.lastPost ? "stale" : "none");
    const tip = c.lastPost ? "last post " + agoStr(t) : "nothing received yet";
    return `<span class="pipe-chan ${cls}" title="${esc(c.name)} — ${esc(tip)}"><span class="pcd"></span>${esc(c.name)}</span>`;
  }).join("");
}

/* ═══════════════════ boot ═══════════════════ */
document.getElementById("thm").onclick = async () => {
  state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = state.settings.theme;
  writeLocal();
  render();
};
/* the storage badge just explains itself — nothing to configure from here */
document.getElementById("sync").onclick = () =>
  toast(cloud.mode === "cloud" ? "Shared across all devices (cloud)" : "Saved in this browser only", "cloud");

icons(document.body);

(async () => {
  /* pull() only tells us the storage mode + brings settings (theme, platform colours) across; the
     channel list itself is hardcoded (SPORTSFC), never edited from the browser */
  try{ await pull(); }
  catch(e){ cloud.mode = "local"; state = readLocal(); }

  /* bring the shared daily-check report across (cloud mode only) so this device shows whatever the
     last run — here or elsewhere — found. Local mode keeps the browser's own copy, already loaded. */
  await pullReport();

  booting = false;
  render();                     // render() owns the entrance animation — do not animate again here

  /* the extension hands its run over through localStorage, so it may be waiting from before
     this page loaded — and it can also arrive while the tab sits open */
  absorbBrowserRun();
  addEventListener("focus", () => { if(absorbBrowserRun()) render(); });
})();
})();
</script>

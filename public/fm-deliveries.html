<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM Deliveries — Aiko</title>
<meta name="description" content="Live read-only viewer over the FM Deliveries feed — every card that went out, and every one that didn't, across dev/test/prod.">
<meta name="theme-color" content="#5b6bff">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b6bff'/%3E%3Cpath d='M9 21l7-13 7 13z' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@13/font/simple-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>

<style>
:root{
  --a1:#5b6bff; --a2:#a855f7; --a3:#ec4899;
  --bg:#f4f5fb; --bg-tint:#eef0f8;
  --surf:#ffffff; --surf2:#f6f7fb; --surf3:#eef0f6;
  --glass:rgba(255,255,255,.72);
  --tx:#0a0d16; --tx2:#565d78; --tx3:#98a0bb;
  --ln:#e6e8f1; --ln2:#eff0f7;
  --red:#e0342c; --amb:#d97706; --grn:#0e9d5a; --blu:#2563eb;
  --s1:0 1px 2px rgba(12,17,40,.06);
  --s2:0 2px 6px rgba(12,17,40,.05),0 14px 32px -16px rgba(12,17,40,.22);
  --s3:0 4px 14px rgba(12,17,40,.08),0 30px 70px -28px rgba(12,17,40,.32);
  --s4:0 40px 90px -30px rgba(12,17,40,.5);
  --rl:22px; --rm:16px; --rs:11px;
  --env:var(--blu);
  color-scheme:light;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#06070d; --bg-tint:#0b0d17;
  --surf:#12141f; --surf2:#181b29; --surf3:#20243590;
  --glass:rgba(13,15,24,.75);
  --tx:#f2f3fb; --tx2:#9aa1c0; --tx3:#666d8c;
  --ln:#242840; --ln2:#1a1d2e;
  --red:#ff6f66; --amb:#fbbf24; --grn:#3fe092; --blu:#5b9bff;
  --s1:0 1px 2px rgba(0,0,0,.4);
  --s2:0 2px 8px rgba(0,0,0,.35),0 16px 36px -18px rgba(0,0,0,.8);
  --s3:0 4px 16px rgba(0,0,0,.4),0 34px 80px -30px rgba(0,0,0,.95);
  --s4:0 50px 110px -30px rgba(0,0,0,1);
}
@media(prefers-color-scheme:dark){
  html:not([data-theme="light"]):not([data-theme="dark"]){
    color-scheme:dark;
    --bg:#06070d; --bg-tint:#0b0d17;
    --surf:#12141f; --surf2:#181b29; --surf3:#20243590;
    --glass:rgba(13,15,24,.75);
    --tx:#f2f3fb; --tx2:#9aa1c0; --tx3:#666d8c;
    --ln:#242840; --ln2:#1a1d2e;
    --red:#ff6f66; --amb:#fbbf24; --grn:#3fe092; --blu:#5b9bff;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","tnum";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--a1) 30%,transparent)}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--a1) 65%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.disp{font-family:"Inter Tight","Inter",sans-serif}
.gt{background:linear-gradient(105deg,var(--a1),var(--a2) 60%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── ambient backdrop ── */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
.aura i{position:absolute;border-radius:50%;filter:blur(120px);opacity:.32;background:var(--env);transition:background .5s ease}
.aura i:nth-child(1){width:52vw;height:52vw;top:-22vw;left:-16vw}
.aura i:nth-child(2){width:38vw;height:38vw;top:2vw;right:-14vw;background:var(--a2);opacity:.2}
.aura i:nth-child(3){width:30vw;height:30vw;bottom:-16vw;left:22vw;background:var(--a3);opacity:.12}
html[data-theme="dark"] .aura i{opacity:.22}
html[data-theme="dark"] .aura i:nth-child(2){opacity:.14}
html[data-theme="dark"] .aura i:nth-child(3){opacity:.09}
@media(prefers-reduced-motion:no-preference){
  .aura i:nth-child(1){animation:dr1 28s ease-in-out infinite}
  .aura i:nth-child(2){animation:dr2 32s ease-in-out infinite}
  .aura i:nth-child(3){animation:dr3 36s ease-in-out infinite}
}
@keyframes dr1{50%{transform:translate(6vw,7vw) scale(1.14)}}
@keyframes dr2{50%{transform:translate(-7vw,8vw) scale(.9)}}
@keyframes dr3{50%{transform:translate(4vw,-6vw) scale(1.1)}}

/* ── entrance / motion primitives ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .5s cubic-bezier(.16,.9,.28,1) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ── buttons ── */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;
  border-radius:12px;font-weight:700;font-size:13.5px;letter-spacing:-.1px;white-space:nowrap;
  background:var(--surf2);border:1px solid var(--ln);position:relative;overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4),box-shadow .18s,background .18s,border-color .18s,color .18s}
.b:hover{transform:translateY(-2px);box-shadow:var(--s1);border-color:color-mix(in srgb,var(--a1) 45%,var(--ln))}
.b:active{transform:translateY(0) scale(.96)}
.b.p{background:linear-gradient(135deg,var(--a1),var(--a2) 65%,var(--a3));color:#fff;border-color:transparent;
  box-shadow:0 8px 22px -8px color-mix(in srgb,var(--a1) 85%,transparent)}
.b.p::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);
  transform:translateX(-120%);transition:transform .55s ease}
.b.p:hover::after{transform:translateX(120%)}
.b.p:hover{box-shadow:0 14px 34px -10px color-mix(in srgb,var(--a1) 95%,transparent)}
.b.g{background:none;border-color:transparent;color:var(--tx2)}
.b.g:hover{background:var(--surf2);color:var(--tx);border-color:var(--ln)}
.b.s{padding:7px 13px;font-size:12.5px;border-radius:10px;gap:5px}
.b.xs{padding:5px 10px;font-size:11.5px;border-radius:8px;gap:4px;font-weight:650}
.b.i{padding:0;width:34px;height:34px;border-radius:10px;flex:none}
.b.i.s{width:30px;height:30px;border-radius:9px}
.b[disabled]{opacity:.4;pointer-events:none}
.b svg{width:15px;height:15px;flex:none}
.b.xs svg{width:12px;height:12px}
.b.on{background:color-mix(in srgb,var(--a1) 18%,var(--surf2));border-color:color-mix(in srgb,var(--a1) 55%,var(--ln));color:var(--a1)}

/* ── topbar ── */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:13px 22px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);border-bottom:1px solid var(--ln);
  border-top:3px solid var(--env);flex-wrap:wrap;transition:border-color .4s}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.5px}
.brand .m{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));color:#fff;
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--a1) 90%,transparent)}
.brand .m svg{width:17px;height:17px}
.brand .back{color:var(--tx3);font-weight:650;font-size:12.5px;display:flex;align-items:center;gap:4px;padding:4px 2px;border-radius:8px}
.brand .back:hover{color:var(--tx2);transform:translateX(-2px)}
.sp{flex:1}

.envsw{position:relative;display:flex;gap:2px;background:var(--surf2);border:1px solid var(--ln);border-radius:13px;padding:4px}
.envsw .ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:9px;background:var(--surf);box-shadow:var(--s1);
  transition:transform .38s cubic-bezier(.34,1.56,.64,1),width .38s cubic-bezier(.34,1.56,.64,1),background .3s;z-index:0}
.envsw button{position:relative;z-index:1;padding:6px 14px;border-radius:9px;font-weight:800;font-size:12.5px;letter-spacing:.02em;color:var(--tx3);transition:color .2s}
.envsw button.on{color:var(--env)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 13px;
  border-radius:999px;border:1px solid var(--ln);background:var(--surf2);color:var(--tx2);cursor:pointer;transition:.18s}
.live:hover{border-color:color-mix(in srgb,var(--a1) 40%,var(--ln))}
.live .d{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}
.live.on .d{background:var(--grn);box-shadow:0 0 0 4px color-mix(in srgb,var(--grn) 25%,transparent);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;box-shadow:0 0 0 7px color-mix(in srgb,var(--grn) 12%,transparent)}}

/* ── layout ── */
.shell{max-width:1220px;margin:0 auto;padding:26px 22px 70px}
.card{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rl);box-shadow:var(--s2)}

/* ── banners ── */
.banner{display:flex;gap:12px;padding:14px 17px;border-radius:var(--rm);margin-bottom:14px;font-size:13.5px;line-height:1.55;
  border:1px solid transparent;animation:fadeUp .35s cubic-bezier(.16,.9,.28,1) both}
.banner svg{width:19px;height:19px;flex:none;margin-top:1px}
.banner.warn{background:color-mix(in srgb,var(--amb) 13%,var(--surf));border-color:color-mix(in srgb,var(--amb) 35%,var(--ln));color:var(--tx)}
.banner.warn svg{color:var(--amb)}
.banner.err{background:color-mix(in srgb,var(--red) 11%,var(--surf));border-color:color-mix(in srgb,var(--red) 35%,var(--ln));color:var(--tx)}
.banner.err svg{color:var(--red)}
.banner.info{background:color-mix(in srgb,var(--blu) 11%,var(--surf));border-color:color-mix(in srgb,var(--blu) 32%,var(--ln));color:var(--tx)}
.banner.info svg{color:var(--blu)}
.banner b{font-weight:750}
.banner code{background:var(--surf3);padding:1px 6px;border-radius:5px;font-size:12px}

/* ── kpis ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:20px 20px 18px;text-align:left;border-radius:var(--rl);cursor:pointer;position:relative;overflow:hidden;
  background:var(--surf);border:1px solid var(--ln);box-shadow:var(--s2);
  transition:transform .22s cubic-bezier(.2,.9,.3,1.3),box-shadow .22s,border-color .22s}
.kpi::before{content:"";position:absolute;top:-40%;right:-30%;width:70%;height:140%;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--k) 20%,transparent),transparent);opacity:0;transition:opacity .3s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--s3);border-color:color-mix(in srgb,var(--k) 35%,var(--ln))}
.kpi:hover::before{opacity:1}
.kpi.on{border-color:var(--k);box-shadow:0 0 0 2px color-mix(in srgb,var(--k) 30%,transparent),var(--s3)}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
  background:color-mix(in srgb,var(--k) 16%,var(--surf2));color:var(--k)}
.kpi .ic svg{width:18px;height:18px}
.kpi .n{font-family:"Inter Tight",sans-serif;font-size:34px;font-weight:900;letter-spacing:-.03em;font-feature-settings:"tnum";line-height:1}
.kpi .l{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-top:7px}
.kpi.delivered{--k:var(--grn)} .kpi.failed{--k:var(--red)} .kpi.pending{--k:var(--blu)} .kpi.unconfirmed{--k:var(--amb)}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ── filters ── */
.filters{padding:19px 20px;margin-bottom:16px}
.frow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.frow + .frow{margin-top:13px}
.flabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);width:100%;margin-bottom:-3px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--surf2);font-size:12.5px;font-weight:650;color:var(--tx2);
  transition:transform .15s cubic-bezier(.2,.9,.3,1.3),border-color .15s,background .15s,color .15s}
.chip:hover{border-color:color-mix(in srgb,var(--a1) 42%,var(--ln));transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 20%,var(--surf)),color-mix(in srgb,var(--a2) 16%,var(--surf)));
  border-color:color-mix(in srgb,var(--a1) 55%,var(--ln));color:var(--a1);font-weight:750}
.finput{background:var(--surf2);border:1.5px solid var(--ln);border-radius:10px;padding:8px 11px;font-size:13px;min-width:0;transition:.16s}
.finput:focus{outline:none;border-color:var(--a1);background:var(--surf);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 13%,transparent)}
select.finput{padding-right:6px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fgrid label,.flab{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--tx3)}
@media(max-width:900px){.fgrid{grid-template-columns:repeat(2,1fr)}}
.fnote{font-size:12px;color:var(--tx3);line-height:1.55;width:100%}
.fnote b{color:var(--tx2)}
.actchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.actchip{display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border-radius:999px;
  background:color-mix(in srgb,var(--a1) 13%,var(--surf2));color:var(--a1);font-size:12px;font-weight:700;
  animation:popIn .25s cubic-bezier(.2,.9,.3,1.4) both}
.actchip button{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 22%,transparent);transition:.15s}
.actchip button:hover{background:color-mix(in srgb,var(--a1) 40%,transparent);transform:rotate(90deg)}
.actchip button svg{width:10px;height:10px}

/* ── status + toolbar ── */
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 2px 14px}
.stat{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--tx3)}
.stat b{color:var(--tx);font-weight:750}
.stat .ord{margin-left:auto}
.grpwrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.grpwrap label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}

/* ── list ── */
.list{display:flex;flex-direction:column;gap:12px}
.skrow{height:112px;border-radius:var(--rm);background:linear-gradient(100deg,var(--surf2) 8%,var(--surf3) 18%,var(--surf2) 33%);
  background-size:300% 100%;animation:shimmer 1.5s ease-in-out infinite}
@keyframes shimmer{0%{background-position:130% 0}100%{background-position:-30% 0}}
.empty{padding:70px 20px;text-align:center;color:var(--tx3);animation:fadeUp .4s ease both}
.empty .eic{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 14%,var(--surf2)),color-mix(in srgb,var(--a2) 10%,var(--surf2)))}
.empty .eic svg{width:26px;height:26px;color:var(--a1)}
.empty .et{font-weight:750;color:var(--tx2);font-size:15px;margin-bottom:4px}

/* ── group section ── */
.grp{margin-bottom:4px}
.grp-head{display:flex;align-items:center;gap:11px;padding:11px 6px;cursor:pointer;user-select:none}
.grp-head .gtitle{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:9px}
.grp-head .gcount{font-size:12px;color:var(--tx3);font-weight:650}
.grp-head .gdots{display:flex;gap:5px;margin-left:6px}
.grp-head .gdots span{width:7px;height:7px;border-radius:50%}
.grp-head .gchev{margin-left:auto;color:var(--tx3);transition:transform .25s}
.grp.collapsed .gchev{transform:rotate(-90deg)}
.grp-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.2,.9,.3,1)}
.grp.collapsed .grp-body{grid-template-rows:0fr}
.grp-body-inner{overflow:hidden;display:flex;flex-direction:column;gap:12px}
.grp.collapsed .grp-body-inner{padding-top:0}

/* ── delivery card ── */
.dcard{border-radius:var(--rm);border:1px solid var(--ln);background:var(--surf);overflow:hidden;
  border-top:4px solid var(--k,var(--ln));box-shadow:var(--s1);
  transition:box-shadow .2s,transform .2s,border-color .2s;
  animation:fadeUp .5s cubic-bezier(.16,.9,.28,1) both}
.dcard:hover{box-shadow:var(--s2);transform:translateY(-1px)}
.dcard.delivered{--k:var(--grn)} .dcard.failed{--k:var(--red)} .dcard.pending{--k:var(--blu)} .dcard.unconfirmed{--k:var(--amb)}
.dc-top{display:flex;align-items:flex-start;gap:13px;padding:15px 17px;cursor:pointer}
.dc-plat{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--k) 13%,var(--surf2));color:var(--tx2);font-size:17px;box-shadow:var(--s1)}
.dc-plat svg{width:18px;height:18px}
.dc-main{flex:1;min-width:0}
.dc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-ch{font-weight:800;font-size:14.5px;letter-spacing:-.1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;background:color-mix(in srgb,var(--k) 17%,var(--surf2));color:var(--k)}
.badge.gy{background:var(--surf3);color:var(--tx2);text-transform:none;font-weight:650}
.badge.stage{background:var(--surf3);color:var(--tx2);text-transform:none;font-weight:650}
.dc-cap{color:var(--tx2);font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dc-meta{display:flex;flex-wrap:wrap;gap:11px;margin-top:8px;font-size:12px;color:var(--tx3)}
.dc-meta span{display:inline-flex;align-items:center;gap:4px}
.dc-meta svg{width:12px;height:12px}
.dc-right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.dc-time{font-size:12px;color:var(--tx2);font-weight:700}
.dc-time .rel{color:var(--tx3);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.dc-chev{color:var(--tx3);transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.dcard.open .dc-chev{transform:rotate(180deg)}
.dc-err{margin:0 17px 15px;padding:10px 13px;border-radius:10px;background:color-mix(in srgb,var(--red) 9%,var(--surf));
  border:1px solid color-mix(in srgb,var(--red) 25%,var(--ln));color:var(--tx);font-size:12.5px;line-height:1.55}
.dc-cav{margin:0 17px 15px;padding:10px 13px;border-radius:10px;background:color-mix(in srgb,var(--amb) 10%,var(--surf));
  border:1px solid color-mix(in srgb,var(--amb) 30%,var(--ln));color:var(--tx);font-size:12.5px;line-height:1.55}
.dc-body-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.9,.3,1)}
.dcard.open .dc-body-wrap{grid-template-rows:1fr}
.dc-body{overflow:hidden}
.dc-body-inner{border-top:1px solid var(--ln2);padding:16px 17px;background:var(--surf2)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px 18px;font-size:12.5px}
.dgrid .k{color:var(--tx3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.dgrid .v{color:var(--tx);word-break:break-word}
.thumb{width:100%;max-width:150px;border-radius:10px;border:1px solid var(--ln);display:block;margin-top:8px;background:var(--surf3);box-shadow:var(--s1)}
.dc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.attempts{margin-top:13px;border-top:1px dashed var(--ln);padding-top:13px}
.attempt-row{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--ln2)}
.attempt-row:last-child{border-bottom:0}
details.raw{margin-top:13px}
details.raw summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--tx3)}
details.raw summary:hover{color:var(--tx2)}
details.raw pre{margin:9px 0 0;padding:13px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;
  font-size:11.5px;overflow:auto;max-height:340px;color:var(--tx2)}

/* ── pagination ── */
.pager{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:24px;flex-wrap:wrap}
.pager .pg{font-size:13px;color:var(--tx2);padding:0 6px;font-weight:600}
.pager input{width:56px;text-align:center}

footer{text-align:center;color:var(--tx3);font-size:12.5px;padding:14px 0 34px;line-height:1.7}

.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--tx2) 30%,transparent);
  border-top-color:var(--tx2);animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.b.p .spin{border-color:rgba(255,255,255,.4);border-top-color:#fff}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toastmsg{background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;
  box-shadow:var(--s4);animation:tin .3s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="aura"><i></i><i></i><i></i></div>

<header>
  <div class="brand">
    <span class="m"><i data-lucide="database"></i></span>
    <span>FM Deliveries</span>
  </div>
  <a class="brand back" href="index.html"><i data-lucide="arrow-left" style="width:13px;height:13px"></i>Aiko</a>
  <div class="sp"></div>
  <div class="envsw" id="envsw">
    <span class="ind" id="envInd"></span>

    <button data-env="test">Test</button>

  </div>
  <button class="live" id="liveBtn" title="Toggle auto-refresh">

  </button>

</header>

<div class="shell">

  <div id="banners"></div>

  <div class="kpis" id="kpis">
    <button class="kpi delivered" data-outcome="delivered"><div class="ic"><i data-lucide="check-circle-2"></i></div><div class="n">—</div><div class="l">Delivered</div></button>
    <button class="kpi failed" data-outcome="failed"><div class="ic"><i data-lucide="octagon-alert"></i></div><div class="n">—</div><div class="l">Failed / skipped</div></button>
    <button class="kpi pending" data-outcome="pending"><div class="ic"><i data-lucide="clock"></i></div><div class="n">—</div><div class="l">Pending</div></button>
    <button class="kpi unconfirmed" data-outcome="unconfirmed"><div class="ic"><i data-lucide="help-circle"></i></div><div class="n">—</div><div class="l">Unconfirmed</div></button>
  </div>

  <div class="card filters">
    <div class="frow">
      <span class="flabel">Window</span>

      <button class="chip" data-preset="today">Today</button>
      <button class="chip" data-preset="tomorrow">Tomorrow</button>
      <button class="chip" data-preset="7d">Last 7 days</button>
      <button class="chip" data-preset="30d">Last 30 days</button>

    <div class="frow">

    <div class="frow fgrid">

        <input class="finput" id="channelInput" placeholder="Telegram_1:N, Instagram" list="channelList">

        <input class="finput" id="languageInput" placeholder="e.g. vietnamese" list="languageList">

      </label>

    <div class="frow" style="align-items:flex-end">
      <label class="flab">Narration language on this page
        <select class="finput" id="narrationFilter">
          <option value="">any</option>
          <option value="english">english</option>
          <option value="vietnamese">vietnamese</option>
          <option value="portuguese">portuguese</option>
          <option value="hindi">hindi</option>
          <option value="thai">thai</option>
        </select>
      </label>
      <label class="flab">Group by
        <select class="finput" id="groupBy">
          <option value="">no grouping</option>
          <option value="channel">channel</option>
          <option value="language">fmLanguageKey</option>

        </select>
      </label>
      <label class="flab">Per page
        <select class="finput" id="limitInput">
          <option>25</option><option selected>50</option><option>100</option><option>200</option><option>500</option>
        </select>
      </label>
      <span style="flex:1"></span>
      <button class="b s g" id="copyCurl"><i data-lucide="terminal"></i>Copy as curl</button>
      <button class="b s g" id="resetFilters"><i data-lucide="rotate-ccw"></i>Reset</button>
      <button class="b s p" id="refreshBtn"><i data-lucide="refresh-cw"></i>Refresh</button>
    </div>

    <div class="actchips" id="activeChips"></div>
  </div>

  <div class="toolbar"><div class="stat" id="statStrip"></div></div>

  <div class="list" id="list">
    <div class="skrow"></div><div class="skrow"></div><div class="skrow"></div>
  </div>

  <div class="pager" id="pager"></div>

  <footer>
    Read-only viewer over the FM Deliveries feed · nothing here can write back to the CMS<br>
    <span id="cfgFoot"></span>
  </footer>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";

/* ═══════════════════ tiny utilities ═══════════════════ */
function icons(root){
  const l = window.lucide;
  if(l && l.createIcons){ try{ l.createIcons({ root: root || document.body, attrs:{ "stroke-width":2 } }); return; }catch(e){} }
}
function toast(msg){
  const host = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toastmsg"; el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); toast("Copied"); }
  catch(e){ toast("Could not copy — copy manually"); }
}

/* relative + absolute time, both surfaced (title = absolute, text = relative) so nothing is hidden
   behind a format guess — the guide is explicit that different timestamp fields mean different
   things (§4), so every rendered time keeps its exact ISO value one hover away. */
function relTime(iso){
  if(!iso) return "—";
  const t = new Date(iso).getTime();
  if(!isFinite(t)) return "—";
  const now = Date.now();
  const diff = Math.round((t - now) / 1000);
  const abs = Math.abs(diff);
  const past = diff <= 0;
  const units = [["y",31536000],["mo",2592000],["d",86400],["h",3600],["m",60],["s",1]];
  for(const [label, secs] of units){
    if(abs >= secs || label === "s"){
      const n = Math.max(1, Math.round(abs / secs));
      return past ? `${n}${label} ago` : `in ${n}${label}`;
    }
  }
  return "—";
}
function fmtAbs(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return isFinite(d.getTime()) ? d.toLocaleString() : "";
}
function timeEl(iso){
  if(!iso) return '<span class="v" style="color:var(--tx3)">—</span>';
  return `<span class="v" title="${esc(iso)}">${esc(fmtAbs(iso))} <span style="color:var(--tx3)">(${esc(relTime(iso))})</span></span>`;
}

function dayStart(offsetDays){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + offsetDays); return d;
}
function toLocalInput(d){
  if(!d) return "";
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInput(s){
  if(!s) return "";
  const d = new Date(s);
  return isFinite(d.getTime()) ? d.toISOString() : "";
}

/* ═══════════════════ constants (fallbacks only — meta.js overrides live, per guide §10) ═══════════════════ */
const ENVS = ["dev","test","prod"];
const FALLBACK_VOCAB = {
  states: ["queued","sending","sent","failed","unknown","skipped"],
  outcomes: ["delivered","failed","pending","unconfirmed"],
  failureStages: ["cms","fm","unconfirmed"],
  maxLimit: 500,
};
const OUTCOME_CLASS = { delivered:"delivered", failed:"failed", pending:"pending", unconfirmed:"unconfirmed" };
const OUTCOME_DOT = { delivered:"var(--grn)", failed:"var(--red)", pending:"var(--blu)", unconfirmed:"var(--amb)" };
const PLATFORM_ICON = [
  [/telegram/i, "si-telegram", "#229ed9"], [/instagram/i, "si-instagram", "#e1306c"],
  [/facebook/i, "si-facebook", "#1877f2"], [/youtube/i, "si-youtube", "#ff0033"],
  [/tiktok/i, "si-tiktok", "#00b8c4"], [/\bx(_|$)/i, "si-x", "#16181c"], [/twitter/i, "si-x", "#16181c"],
];
function platformIcon(ch){
  const hit = PLATFORM_ICON.find(([re]) => re.test(ch || ""));
  if(hit) return `<i class="si ${hit[1]}" style="color:${hit[2]}"></i>`;
  return '<i data-lucide="radio-tower"></i>';
}

/* ═══════════════════ state ═══════════════════ */
const state = {
  env: "dev",
  meta: {},              // per-env vocab cache
  filters: { timeField:"queued", since:"", until:"", channel:"", language:"", states:[], outcomes:[], matchId:"", cardId:"", narration:"" },
  limit: 50, page: 1, groupBy: "",
  deliveries: [], pageOutcomes:null, totalPages:1, totalDeliveries:0, hasNextPage:false, orderOldestFirst:false,
  loading:false, lastError:null, lastUpdated:null,
  kpi: { delivered:null, failed:null, pending:null, unconfirmed:null },
  autoRefresh:true, refreshMs:20000,
  seenChannels:new Set(), seenLanguages:new Set(),
  openCards:new Set(), collapsedGroups:new Set(),
};

/* ═══════════════════ URL <-> state (so a filtered view is shareable) ═══════════════════ */
function hydrateFromUrl(){
  const p = new URLSearchParams(location.search);
  if(ENVS.includes(p.get("env"))) state.env = p.get("env");
  if(p.get("timeField") === "sent") state.filters.timeField = "sent";
  ["since","until","channel","language","matchId","cardId"].forEach(k => { if(p.get(k)) state.filters[k] = p.get(k); });
  if(p.get("states")) state.filters.states = p.get("states").split(",").filter(Boolean);
  if(p.get("outcomes")) state.filters.outcomes = p.get("outcomes").split(",").filter(Boolean);
  if(p.get("narration")) state.filters.narration = p.get("narration");
  if(p.get("group")) state.groupBy = p.get("group");
  if(p.get("limit")) state.limit = Math.max(1, Math.min(500, Number(p.get("limit")) || 50));
  if(p.get("page")) state.page = Math.max(1, Number(p.get("page")) || 1);
}
function syncUrl(){
  const p = new URLSearchParams();
  p.set("env", state.env);
  const f = state.filters;
  if(f.timeField !== "queued") p.set("timeField", f.timeField);
  if(f.since) p.set("since", f.since);
  if(f.until) p.set("until", f.until);
  if(f.channel) p.set("channel", f.channel);
  if(f.language) p.set("language", f.language);
  if(f.matchId) p.set("matchId", f.matchId);
  if(f.cardId) p.set("cardId", f.cardId);
  if(f.states.length) p.set("states", f.states.join(","));
  if(f.outcomes.length) p.set("outcomes", f.outcomes.join(","));
  if(f.narration) p.set("narration", f.narration);
  if(state.groupBy) p.set("group", state.groupBy);
  if(state.limit !== 50) p.set("limit", state.limit);
  if(state.page !== 1) p.set("page", state.page);
  history.replaceState(null, "", location.pathname + "?" + p.toString());
}

/* ═══════════════════ fetch layer (GET only, always) ═══════════════════ */
async function apiGet(path, params){
  const url = new URL(path, location.origin);
  Object.entries(params || {}).forEach(([k,v]) => { if(v !== undefined && v !== null && v !== "") url.searchParams.set(k, v); });
  let r, body;
  try{ r = await fetch(url.toString(), { method:"GET" }); }
  catch(e){ return { ok:false, status:0, error:`Network error: ${e && e.message || e}`, body:null }; }
  const text = await r.text();
  try{ body = text ? JSON.parse(text) : null; }catch(e){ body = null; }
  if(!r.ok){
    const msg = (body && (body.error || body.message || body.detail)) || text || `HTTP ${r.status}`;
    return { ok:false, status:r.status, error:msg, body };
  }
  return { ok:true, status:r.status, body };
}

function currentQuery(extra){
  const f = state.filters;
  const language = (f.narration && ["hindi","thai"].includes(f.narration)) ? "english" : (f.language || undefined);
  return Object.assign({
    env: state.env,
    timeField: f.timeField !== "queued" ? f.timeField : undefined,
    since: f.since || undefined, until: f.until || undefined,
    channel: f.channel || undefined,
    language,
    state: f.states.length ? f.states.join(",") : undefined,
    outcome: f.outcomes.length ? f.outcomes.join(",") : undefined,
    matchId: f.matchId || undefined,
    cardId: f.cardId || undefined,
    limit: state.limit, page: state.page,
  }, extra || {});
}

async function loadMeta(){
  const cached = state.meta[state.env];
  if(cached) return cached;
  const res = await apiGet("/api/fm-deliveries-meta", { env: state.env });
  let v = Object.assign({}, FALLBACK_VOCAB);
  if(res.ok && res.body){
    const b = res.body;
    v = {
      states: b.states || b.state || FALLBACK_VOCAB.states,
      outcomes: b.outcomes || b.outcome || FALLBACK_VOCAB.outcomes,
      failureStages: b.failureStages || b.failureStage || FALLBACK_VOCAB.failureStages,
      maxLimit: b.maxLimit || FALLBACK_VOCAB.maxLimit,
    };
  }
  state.meta[state.env] = v;
  return v;
}

let loadSeq = 0;
async function loadDeliveries(){
  const seq = ++loadSeq;
  state.loading = true; state.lastError = null;
  renderStatusStrip(); renderListLoading();

  const res = await apiGet("/api/fm-deliveries", currentQuery());
  if(seq !== loadSeq) return; // a newer request already landed
  state.loading = false;

  if(!res.ok){
    state.lastError = { status: res.status, message: res.error };
    state.deliveries = []; state.pageOutcomes = null; state.totalPages = 1; state.totalDeliveries = 0; state.hasNextPage = false;
    renderAll();
    return;
  }
  const b = res.body || {};
  let rows = Array.isArray(b.deliveries) ? b.deliveries : [];

  if(state.filters.narration){
    rows = rows.filter(r => (r && r.language) === state.filters.narration);
  }
  rows.forEach(r => {
    if(r && r.channel) state.seenChannels.add(r.channel);
    if(r && r.language) state.seenLanguages.add(r.language);
  });

  state.deliveries = rows;
  state.pageOutcomes = b.pageOutcomes || null;
  state.totalPages = b.totalPages || 1;
  state.totalDeliveries = typeof b.totalDeliveries === "number" ? b.totalDeliveries : rows.length;
  state.hasNextPage = !!b.hasNextPage;
  state.orderOldestFirst = !!state.filters.since;
  state.lastUpdated = Date.now();
  state.lastError = null;
  renderAll();
  loadKpis();
}

async function loadKpis(){
  const base = currentQuery({ limit:1, page:1, state:undefined, outcome:undefined });
  const outcomes = ["delivered","failed","pending","unconfirmed"];
  const results = await Promise.all(outcomes.map(o => apiGet("/api/fm-deliveries", Object.assign({}, base, { outcome:o }))));
  outcomes.forEach((o, i) => {
    const r = results[i];
    state.kpi[o] = (r.ok && r.body && typeof r.body.totalDeliveries === "number") ? r.body.totalDeliveries : null;
  });
  renderKpis();
}

/* ═══════════════════ render: banners ═══════════════════ */
function renderBanners(){
  const host = document.getElementById("banners");
  const parts = [];

  if(state.lastError){
    const { status, message } = state.lastError;
    let hint = "";
    if(status === 401) hint = "Check the x-api-key configured for this environment.";
    else if(status === 503) hint = "This environment isn't configured on this deployment yet — see the footer for which env vars are missing.";
    else if(status === 400) hint = "One of the active filters wasn't understood — see the message above.";
    else if(status === 0) hint = "Could not reach this site's own API route.";
    parts.push(`<div class="banner err"><i data-lucide="alert-circle"></i><div><b>HTTP ${status || "error"}.</b> ${esc(message)}${hint ? "<br>"+esc(hint) : ""}</div></div>`);
  }

  const caveatRows = state.deliveries.filter(r => r && r.distributionCaveat);
  if(caveatRows.length){
    parts.push(`<div class="banner warn"><i data-lucide="alert-triangle"></i><div>
      <b>${caveatRows.length} card${caveatRows.length>1?"s":""} on this page ${caveatRows.length>1?"carry":"carries"} no matchId</b> — competition/season/team-wide content.
      FM accepts these and returns success, but the downstream distribution step 404s on the empty match segment and treats it as a skip —
      so the card may never reach distribution even though the CMS and FM both show success.
      This is a known issue <b>outside</b> the CMS — don't file it as a CMS delivery failure.
    </div></div>`);
  }

  if(state.filters.narration && ["hindi","thai"].includes(state.filters.narration)){
    parts.push(`<div class="banner info"><i data-lucide="info"></i><div>
      Querying <code>language=english</code> and narrowing to <b>${esc(state.filters.narration)}</b> on this page client-side (§6 of the guide) —
      ${esc(state.filters.narration)} cards are filed with FM under <code>english</code>. Pagination totals below reflect all English-filed cards, not just ${esc(state.filters.narration)} ones.
    </div></div>`);
  }

  if(state.groupBy){
    parts.push(`<div class="banner info"><i data-lucide="layers"></i><div>
      Grouping applies to the <b>${state.deliveries.length} cards currently loaded</b> (this page only) — widen the window or raise "Per page" above to see a fuller picture grouped together.
    </div></div>`);
  }

  host.innerHTML = parts.join("");
  icons(host);
}

/* ═══════════════════ render: kpis ═══════════════════ */
function renderKpis(){
  document.querySelectorAll("#kpis .kpi").forEach(btn => {
    const o = btn.dataset.outcome;
    const n = btn.querySelector(".n");
    const v = state.kpi[o];
    n.textContent = state.loading && v === null ? "…" : (v === null ? "—" : v.toLocaleString());
    btn.classList.toggle("on", state.filters.outcomes.length === 1 && state.filters.outcomes[0] === o);
  });
}

/* ═══════════════════ render: filters chrome ═══════════════════ */
function renderStateChips(vocab){
  const host = document.getElementById("stateChips");
  host.innerHTML = vocab.states.map(s =>
    `<button class="chip ${state.filters.states.includes(s) ? "on" : ""}" data-state="${esc(s)}">${esc(s)}</button>`
  ).join("");
}
function renderActiveChips(){
  const f = state.filters;
  const chips = [];
  const add = (label, clearFn) => chips.push({ label, clearFn });
  if(f.since || f.until) add(`window: ${f.since ? fmtAbs(f.since) : "…"} → ${f.until ? fmtAbs(f.until) : "…"}`, () => { f.since=""; f.until=""; });
  if(f.timeField !== "queued") add(`by ${f.timeField}At`, () => { f.timeField = "queued"; });
  if(f.channel) add(`channel: ${f.channel}`, () => { f.channel = ""; });
  if(f.language) add(`language key: ${f.language}`, () => { f.language = ""; });
  if(f.narration) add(`narration: ${f.narration}`, () => { f.narration = ""; });
  f.states.forEach(s => add(`state: ${s}`, () => { f.states = f.states.filter(x => x !== s); }));
  f.outcomes.forEach(o => add(`outcome: ${o}`, () => { f.outcomes = f.outcomes.filter(x => x !== o); }));
  if(f.matchId) add(`matchId: ${f.matchId}`, () => { f.matchId = ""; });
  if(f.cardId) add(`card/setId: ${f.cardId}`, () => { f.cardId = ""; });
  if(state.groupBy) add(`grouped by: ${state.groupBy}`, () => { state.groupBy = ""; });

  const host = document.getElementById("activeChips");
  if(!chips.length){ host.innerHTML = ""; return; }
  host.innerHTML = chips.map((c,i) => `<span class="actchip">${esc(c.label)}<button data-i="${i}"><i data-lucide="x"></i></button></span>`).join("");
  host.querySelectorAll("button[data-i]").forEach(btn => {
    btn.onclick = () => { chips[Number(btn.dataset.i)].clearFn(); state.page = 1; syncUrl(); renderFilterInputs(); loadDeliveries(); };
  });
  icons(host);
}
function renderFilterInputs(){
  const f = state.filters;
  document.getElementById("timeField").value = f.timeField;
  document.getElementById("sinceInput").value = toLocalInput(f.since ? new Date(f.since) : null);
  document.getElementById("untilInput").value = toLocalInput(f.until ? new Date(f.until) : null);
  document.getElementById("channelInput").value = f.channel;
  document.getElementById("languageInput").value = f.language;
  document.getElementById("matchIdInput").value = f.matchId;
  document.getElementById("cardIdInput").value = f.cardId;
  document.getElementById("narrationFilter").value = f.narration;
  document.getElementById("groupBy").value = state.groupBy;
  document.getElementById("limitInput").value = String(state.limit);
  document.getElementById("timeFieldNote").innerHTML = f.timeField === "sent"
    ? "⚠️ <b>sent</b> excludes every card that never went out — skipped/failed-before-FM cards have no sentAt."
    : "queuedAt is the only timestamp every row has, including skipped cards — this is the safe default.";
  document.getElementById("langWarn").innerHTML =
    "⚠️ This filter matches <b>fmLanguageKey</b>, not the card's narration language. Hindi and Thai (and Portuguese, where that flag is off) are filed under <code>english</code>.";
  document.querySelectorAll("#stateChips .chip").forEach(c => c.classList.toggle("on", f.states.includes(c.dataset.state)));
  document.getElementById("channelList").innerHTML = [...state.seenChannels].map(c => `<option value="${esc(c)}">`).join("");
  document.getElementById("languageList").innerHTML = ["english","vietnamese","portuguese","hindi","thai", ...state.seenLanguages]
    .filter((v,i,a) => a.indexOf(v)===i).map(c => `<option value="${esc(c)}">`).join("");
  renderActiveChips();
}

/* ═══════════════════ render: status strip + pager ═══════════════════ */
function renderStatusStrip(){
  const host = document.getElementById("statStrip");
  if(state.loading){ host.innerHTML = `<span class="spin"></span> Loading…`; return; }
  if(state.lastError){ host.innerHTML = ""; return; }
  const po = state.pageOutcomes;
  const poStr = po ? `this page: ${po.delivered||0} delivered · ${po.failed||0} failed · ${po.pending||0} pending · ${po.unconfirmed||0} unconfirmed` : "";
  host.innerHTML = `
    <span><b>${state.totalDeliveries.toLocaleString()}</b> total in this window</span>
    <span title="pageOutcomes counts this page only, not the whole filtered window">${esc(poStr)} ⓘ</span>
    <span class="ord">ordering: ${state.orderOldestFirst ? "oldest first (since is set)" : "newest first"}</span>
  `;
}
function renderPager(){
  const host = document.getElementById("pager");
  if(state.loading || !state.deliveries.length){ host.innerHTML = ""; return; }
  host.innerHTML = `
    <button class="b s g" id="pgPrev" ${state.page<=1?"disabled":""}><i data-lucide="chevron-left"></i>Prev</button>
    <span class="pg">Page <input type="number" id="pgJump" value="${state.page}" min="1" max="${state.totalPages}"> of ${state.totalPages}</span>
    <button class="b s g" id="pgNext" ${!state.hasNextPage && state.page>=state.totalPages?"disabled":""}>Next<i data-lucide="chevron-right"></i></button>
  `;
  icons(host);
  document.getElementById("pgPrev").onclick = () => { state.page = Math.max(1, state.page-1); syncUrl(); loadDeliveries(); };
  document.getElementById("pgNext").onclick = () => { state.page = state.page+1; syncUrl(); loadDeliveries(); };
  document.getElementById("pgJump").onchange = e => {
    const n = Math.max(1, Math.min(state.totalPages, Number(e.target.value)||1));
    state.page = n; syncUrl(); loadDeliveries();
  };
}

/* ═══════════════════ render: list ═══════════════════ */
function renderListLoading(){
  if(state.deliveries.length) return; // keep showing current rows while a background refresh runs
  document.getElementById("list").innerHTML = '<div class="skrow"></div><div class="skrow"></div><div class="skrow"></div>';
}
function outcomeClass(row){ return OUTCOME_CLASS[row.outcome] || "pending"; }

function cardHtml(row, idx, delay){
  const cls = outcomeClass(row);
  const key = row.cardId || idx;
  const open = state.openCards.has(key);
  const tpl = row.template ? row.template.label : null;
  const hasAsset = row.asset && row.asset.url;
  return `
  <div class="dcard ${cls} ${open ? "open" : ""}" data-key="${esc(key)}" style="animation-delay:${delay}ms">
    <div class="dc-top">
      <div class="dc-plat">${platformIcon(row.channel)}</div>
      <div class="dc-main">
        <div class="dc-head">
          <span class="dc-ch">${esc(row.channel || "?")}</span>
          <span class="badge gy">${esc(row.language || "—")}${row.fmLanguageKey && row.fmLanguageKey !== row.language ? ` → filed as ${esc(row.fmLanguageKey)}` : ""}</span>
          <span class="badge">${esc(row.state || row.outcome || "?")}</span>
          ${row.failureStage ? `<span class="badge stage">owner: ${esc(row.failureStage)}</span>` : ""}
          ${row.distributionCaveat ? `<span class="badge stage" style="color:var(--amb)"><i data-lucide="alert-triangle" style="width:11px;height:11px"></i> no matchId</span>` : ""}
          ${tpl ? `<span style="color:var(--tx3);font-size:12px">${esc(tpl)}</span>` : ""}
        </div>
        ${row.caption ? `<div class="dc-cap">${esc(row.caption)}</div>` : (row.state === "skipped" ? `<div class="dc-cap" style="font-style:italic">no card was built — see reason below</div>` : "")}
        <div class="dc-meta">
          ${row.match && row.match.matchId ? `<span><i data-lucide="link"></i>${esc(row.match.matchId)}</span>` : ""}
          <span><i data-lucide="hash"></i>${esc(row.cardId || "—")}</span>
          <span><i data-lucide="rotate-cw"></i>${row.attemptCount != null ? row.attemptCount : "—"} attempt${row.attemptCount === 1 ? "" : "s"}</span>
          <span>${esc(row.deliveryMode || "")}</span>
        </div>
      </div>
      <div class="dc-right">
        <div class="dc-time">${row.broadcastScheduledTime ? esc(relTime(row.broadcastScheduledTime)) : "—"}<div class="rel">broadcast</div></div>
        <i data-lucide="chevron-down" class="dc-chev"></i>
      </div>
    </div>
    ${row.error ? `<div class="dc-err"><b>${esc(row.state === "skipped" ? "Why the CMS skipped this:" : "Error:")}</b> ${esc(row.error)}</div>` : ""}
    ${row.outcome === "unconfirmed" ? `<div class="dc-cav">FM timed out — this may or may not have been delivered. Deliberately not counted as failed or delivered.</div>` : ""}
    <div class="dc-body-wrap"><div class="dc-body"><div class="dc-body-inner">
      <div class="dgrid">
        <div><div class="k">queuedAt</div>${timeEl(row.queuedAt)}</div>
        <div><div class="k">sentAt</div>${timeEl(row.sentAt)}</div>
        <div><div class="k">scheduledAt</div>${timeEl(row.scheduledAt)}</div>
        <div><div class="k">broadcastScheduledTime</div>${timeEl(row.broadcastScheduledTime)}</div>
        <div><div class="k">setId</div><span class="v mono">${esc(row.setId || "—")}</span></div>
        <div><div class="k">collection</div><span class="v">${esc(row.collection || "—")}</span></div>
        <div><div class="k">template.id</div><span class="v mono">${row.template ? esc(row.template.id) : "—"}</span></div>
        <div><div class="k">template.kind</div><span class="v">${row.template ? esc(row.template.kind) : "—"}</span></div>
        <div><div class="k">captionSource</div><span class="v">${esc(row.captionSource || "—")}</span></div>
        <div><div class="k">fmStatus</div><span class="v">${esc(row.fmStatus || "—")}</span></div>
        <div><div class="k">cdnUrl</div><span class="v">${row.cdnUrl ? `<a href="${esc(row.cdnUrl)}" target="_blank" rel="noopener">open ↗</a>` : "—"}</span></div>
        <div><div class="k">publishedBy</div><span class="v">${esc(row.publishedBy || "—")}</span></div>
        <div><div class="k">match</div><span class="v">${row.match && row.match.url ? `<a href="${esc(row.match.url)}" target="_blank" rel="noopener">${esc(row.match.matchId || "open ↗")}</a>` : (row.match && row.match.matchId ? esc(row.match.matchId) : "—")}</span></div>
        <div><div class="k">competitionId</div><span class="v mono">${row.match ? esc(row.match.competitionId || "—") : "—"}</span></div>
      </div>
      ${hasAsset ? (row.asset.kind === "image"
        ? `<img class="thumb" loading="lazy" src="${esc(row.asset.url)}" alt="" onerror="this.style.display='none'">`
        : `<div style="margin-top:8px"><a class="b xs g" href="${esc(row.asset.url)}" target="_blank" rel="noopener"><i data-lucide="video"></i>open ${esc(row.asset.kind||"asset")}</a></div>`) : ""}
      <div class="dc-actions">
        <button class="b xs g act-copy" data-copy="${esc(row.cardId||"")}"><i data-lucide="copy"></i>Copy cardId</button>
        <button class="b xs g act-attempts" data-cardid="${esc(row.cardId||"")}" data-key="${esc(key)}"><i data-lucide="history"></i>Load attempts</button>
      </div>
      <div class="attempts" id="attempts-${esc(key)}"></div>
      <details class="raw"><summary>Raw JSON (every field the API returned, including any not shown above)</summary><pre>${esc(JSON.stringify(row, null, 2))}</pre></details>
    </div></div></div>
  </div>`;
}

function outcomeCounts(rows){
  const c = { delivered:0, failed:0, pending:0, unconfirmed:0 };
  rows.forEach(r => { if(r && c[r.outcome] !== undefined) c[r.outcome]++; });
  return c;
}
function groupLabel(){
  return state.groupBy === "channel" ? "channel" : state.groupBy === "language" ? "fmLanguageKey" : "narration language";
}
function groupKeyOf(row){
  if(state.groupBy === "channel") return row.channel || "(no channel)";
  if(state.groupBy === "language") return row.fmLanguageKey || "(none)";
  return row.language || "(unknown)";
}

function wireCardInteractions(host){
  host.querySelectorAll(".dc-top").forEach(el => {
    el.addEventListener("click", () => {
      const card = el.closest(".dcard");
      const key = card.dataset.key;
      card.classList.toggle("open");
      if(card.classList.contains("open")) state.openCards.add(key); else state.openCards.delete(key);
    });
  });
  host.querySelectorAll(".act-copy").forEach(btn => btn.addEventListener("click", e => { e.stopPropagation(); copyText(btn.dataset.copy); }));
  host.querySelectorAll(".act-attempts").forEach(btn => btn.addEventListener("click", async e => {
    e.stopPropagation();
    const cardId = btn.dataset.cardid, key = btn.dataset.key;
    if(!cardId) return;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Loading…';
    const res = await apiGet("/api/fm-deliveries", { env: state.env, cardId, attempts: "true", limit: 1 });
    const box = document.getElementById(`attempts-${key}`);
    if(!res.ok){ box.innerHTML = `<div class="dc-err">Could not load attempts: ${esc(res.error)}</div>`; btn.disabled=false; btn.innerHTML='<i data-lucide="history"></i>Retry'; icons(btn); return; }
    const row = (res.body && Array.isArray(res.body.deliveries)) ? res.body.deliveries[0] : null;
    const list = row && (row.attempts || row.attemptsList || row.sendAttempts);
    if(Array.isArray(list) && list.length){
      box.innerHTML = `<div style="font-size:11px;font-weight:750;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Attempts (newest first)</div>` +
        list.map(a => `<div class="attempt-row"><span class="badge gy">${esc(a.status||a.state||"?")}</span><span>${esc(fmtAbs(a.time||a.at||a.sentAt||""))}</span><span style="color:var(--tx3)">${esc(a.error||"")}</span>${a.cdnUrl?`<a href="${esc(a.cdnUrl)}" target="_blank" rel="noopener">cdn ↗</a>`:""}</div>`).join("");
    } else if(row){
      box.innerHTML = `<div class="fnote">No separate attempts array recognised — showing the full row instead:</div><pre style="margin-top:6px;padding:10px;background:var(--bg);border:1px solid var(--ln);border-radius:9px;font-size:11.5px;overflow:auto;max-height:260px">${esc(JSON.stringify(row,null,2))}</pre>`;
    } else {
      box.innerHTML = `<div class="fnote">No row came back for this cardId.</div>`;
    }
    btn.remove();
  }));
}

function renderList(){
  const host = document.getElementById("list");
  if(state.lastError){ host.innerHTML = ""; return; }
  if(!state.loading && !state.deliveries.length){
    host.innerHTML = `<div class="empty"><div class="eic"><i data-lucide="inbox"></i></div><div class="et">Nothing here</div><div>No cards match these filters in this window.</div></div>`;
    icons(host); return;
  }
  if(!state.deliveries.length) return; // still loading, skeleton already shown

  if(!state.groupBy){
    host.innerHTML = state.deliveries.map((row, idx) => cardHtml(row, idx, Math.min(idx, 10) * 35)).join("");
    icons(host);
    wireCardInteractions(host);
    return;
  }

  const groups = new Map();
  state.deliveries.forEach(row => {
    const k = groupKeyOf(row);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(row);
  });
  const ordered = [...groups.entries()].sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

  host.innerHTML = ordered.map(([name, rows], gi) => {
    const counts = outcomeCounts(rows);
    const collapsed = state.collapsedGroups.has(name);
    const dots = Object.entries(counts).filter(([,n]) => n > 0)
      .map(([o,n]) => `<span title="${n} ${o}" style="background:${OUTCOME_DOT[o]}"></span>`).join("");
    return `
    <section class="grp ${collapsed ? "collapsed" : ""}" data-group="${esc(name)}">
      <div class="grp-head">
        <span class="gtitle"><i data-lucide="chevron-down" class="gchev" style="position:static;margin-left:0"></i>${esc(name)}</span>
        <span class="gcount">${rows.length} card${rows.length===1?"":"s"}</span>
        <span class="gdots">${dots}</span>
      </div>
      <div class="grp-body"><div class="grp-body-inner">
        ${rows.map((row, idx) => cardHtml(row, `${gi}-${idx}`, Math.min(idx, 6) * 30)).join("")}
      </div></div>
    </section>`;
  }).join("");

  icons(host);
  host.querySelectorAll(".grp-head").forEach(h => {
    h.addEventListener("click", () => {
      const sec = h.closest(".grp");
      const name = sec.dataset.group;
      sec.classList.toggle("collapsed");
      if(sec.classList.contains("collapsed")) state.collapsedGroups.add(name); else state.collapsedGroups.delete(name);
    });
  });
  wireCardInteractions(host);
}

function renderAll(){
  renderBanners(); renderKpis(); renderStatusStrip(); renderList(); renderPager();
}

/* ═══════════════════ config footer ═══════════════════ */
function renderCfgFoot(){
  document.getElementById("cfgFoot").textContent =
    `Environment vars: FM_DELIVERIES_API_HOST_${state.env.toUpperCase()} / FM_DELIVERIES_API_KEY_${state.env.toUpperCase()}`;
}

/* ═══════════════════ auto-refresh ═══════════════════ */
let refreshTimer = null;
function scheduleRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  if(!state.autoRefresh) return;
  refreshTimer = setInterval(() => {
    if(document.visibilityState !== "visible") return;
    loadDeliveries();
  }, state.refreshMs);
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && state.autoRefresh) loadDeliveries();
});

/* ═══════════════════ env switcher: sliding indicator ═══════════════════ */
function positionEnvIndicator(){
  const active = document.querySelector(`#envsw button[data-env="${state.env}"]`);
  const ind = document.getElementById("envInd");
  if(!active || !ind) return;
  ind.style.width = active.offsetWidth + "px";
  ind.style.transform = `translateX(${active.offsetLeft - 4}px)`;
}

/* ═══════════════════ wiring ═══════════════════ */
function setEnv(env){
  if(!ENVS.includes(env) || env === state.env) return;
  state.env = env; state.page = 1;
  document.documentElement.style.setProperty("--env", `var(--${env==="dev"?"blu":env==="test"?"amb":"red"})`);
  document.querySelectorAll("#envsw button").forEach(b => b.classList.toggle("on", b.dataset.env === env));
  positionEnvIndicator();
  renderCfgFoot(); syncUrl();
  loadMeta().then(v => renderStateChips(v));
  loadDeliveries();
}

function applyPreset(name){
  const f = state.filters;
  if(name === "all"){ f.since = ""; f.until = ""; }
  else if(name === "yesterday"){ f.since = dayStart(-1).toISOString(); f.until = dayStart(0).toISOString(); }
  else if(name === "today"){ f.since = dayStart(0).toISOString(); f.until = dayStart(1).toISOString(); }
  else if(name === "tomorrow"){ f.since = dayStart(1).toISOString(); f.until = dayStart(2).toISOString(); }
  else if(name === "7d"){ f.since = dayStart(-6).toISOString(); f.until = dayStart(1).toISOString(); }
  else if(name === "30d"){ f.since = dayStart(-29).toISOString(); f.until = dayStart(1).toISOString(); }
  state.page = 1;
  renderFilterInputs(); syncUrl(); loadDeliveries();
}

function initWiring(){
  document.querySelectorAll("#envsw button").forEach(b => b.addEventListener("click", () => setEnv(b.dataset.env)));
  window.addEventListener("resize", debounce(positionEnvIndicator, 120));

  document.querySelectorAll(".filters .chip[data-preset]").forEach(b => b.addEventListener("click", () => applyPreset(b.dataset.preset)));

  document.getElementById("timeField").onchange = e => { state.filters.timeField = e.target.value; state.page=1; renderFilterInputs(); syncUrl(); loadDeliveries(); };
  document.getElementById("sinceInput").onchange = e => { state.filters.since = fromLocalInput(e.target.value); state.page=1; syncUrl(); loadDeliveries(); };
  document.getElementById("untilInput").onchange = e => { state.filters.until = fromLocalInput(e.target.value); state.page=1; syncUrl(); loadDeliveries(); };

  const debouncedTextFilter = debounce(() => { state.page = 1; renderActiveChips(); syncUrl(); loadDeliveries(); }, 450);
  document.getElementById("channelInput").oninput = e => { state.filters.channel = e.target.value.trim(); debouncedTextFilter(); };
  document.getElementById("languageInput").oninput = e => { state.filters.language = e.target.value.trim(); debouncedTextFilter(); };
  document.getElementById("matchIdInput").oninput = e => { state.filters.matchId = e.target.value.trim(); debouncedTextFilter(); };
  document.getElementById("cardIdInput").oninput = e => { state.filters.cardId = e.target.value.trim(); debouncedTextFilter(); };
  document.getElementById("narrationFilter").onchange = e => { state.filters.narration = e.target.value; state.page=1; renderActiveChips(); syncUrl(); loadDeliveries(); };
  document.getElementById("groupBy").onchange = e => { state.groupBy = e.target.value; state.collapsedGroups.clear(); syncUrl(); renderBanners(); renderList(); };
  document.getElementById("limitInput").onchange = e => { state.limit = Number(e.target.value)||50; state.page=1; syncUrl(); loadDeliveries(); };

  document.getElementById("resetFilters").onclick = () => {
    state.filters = { timeField:"queued", since:"", until:"", channel:"", language:"", states:[], outcomes:[], matchId:"", cardId:"", narration:"" };
    state.groupBy = ""; state.page = 1; renderFilterInputs(); renderKpis(); syncUrl(); loadDeliveries();
  };
  document.getElementById("refreshBtn").onclick = () => loadDeliveries();

  document.getElementById("copyCurl").onclick = () => {
    const q = currentQuery({});
    delete q.env;
    const qs = Object.entries(q).filter(([,v]) => v !== undefined && v !== "").map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join("&");
    copyText(`curl -sS -H "x-api-key: $FM_DELIVERIES_API_KEY" "https://<cms-host>/api/fm-deliveries-feed?${qs}"`);
  };

  document.getElementById("stateChips").addEventListener("click", e => {
    const btn = e.target.closest("[data-state]"); if(!btn) return;
    const s = btn.dataset.state;
    const f = state.filters;
    f.states = f.states.includes(s) ? f.states.filter(x => x !== s) : [...f.states, s];
    state.page = 1; renderFilterInputs(); syncUrl(); loadDeliveries();
  });

  document.getElementById("kpis").addEventListener("click", e => {
    const btn = e.target.closest("[data-outcome]"); if(!btn) return;
    const o = btn.dataset.outcome;
    const f = state.filters;
    f.outcomes = (f.outcomes.length === 1 && f.outcomes[0] === o) ? [] : [o];
    state.page = 1; renderFilterInputs(); renderKpis(); syncUrl(); loadDeliveries();
  });

  const liveBtn = document.getElementById("liveBtn");
  function paintLive(){
    liveBtn.classList.toggle("on", state.autoRefresh);
    document.getElementById("liveLbl").textContent = state.autoRefresh ? "Live" : "Paused";
  }
  liveBtn.onclick = () => { state.autoRefresh = !state.autoRefresh; paintLive(); scheduleRefresh(); };
  paintLive();

  const THEME_KEY = "fmdel_theme";
  function applyTheme(t){ if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
  try{ applyTheme(localStorage.getItem(THEME_KEY) || ""); }catch(e){}
  document.getElementById("thm").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  };
}

/* ═══════════════════ boot ═══════════════════ */
(async function init(){
  hydrateFromUrl();
  document.querySelectorAll("#envsw button").forEach(b => b.classList.toggle("on", b.dataset.env === state.env));
  document.documentElement.style.setProperty("--env", `var(--${state.env==="dev"?"blu":state.env==="test"?"amb":"red"})`);
  renderCfgFoot();
  renderFilterInputs();
  initWiring();
  icons(document.body);
  positionEnvIndicator();

  const vocab = await loadMeta();
  renderStateChips(vocab);
  renderFilterInputs();
  icons(document.body);

  await loadDeliveries();
  scheduleRefresh();
})();

})();
</script>
</body>
</html>

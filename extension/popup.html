<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aiko Daily Check</title>
<style>
  :root{
    --bg:#0f1117; --surf:#171a23; --surf2:#1e222d; --ln:#2a2f3d;
    --tx:#e7e9ef; --tx2:#a1a7b8; --tx3:#6d7488;
    --a1:#5b6bff; --grn:#22c55e; --amb:#f59e0b; --red:#ef4444;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7fb; --surf:#fff; --surf2:#f1f3f9; --ln:#e2e5ee;
           --tx:#151824; --tx2:#565d72; --tx3:#8a90a4; }
  }
  *{box-sizing:border-box}
  body{margin:0;width:392px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--tx)}
  header{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--ln)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--a1);flex:none}
  h1{margin:0;font-size:14px;font-weight:680;letter-spacing:-.2px}
  main{padding:14px 15px;display:flex;flex-direction:column;gap:12px}
  label{display:block;font-size:11px;font-weight:640;color:var(--tx3);
        text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:9px;
        background:var(--surf);color:var(--tx);font:inherit}
  select{cursor:pointer;font-weight:600}
  input:focus,select:focus{outline:2px solid var(--a1);outline-offset:-1px;border-color:transparent}
  button{padding:9px 14px;border:1px solid var(--ln);border-radius:9px;background:var(--surf2);
         color:var(--tx);font:inherit;font-weight:620;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--a1)}
  button:disabled{opacity:.5;cursor:default}
  button.p{background:var(--a1);border-color:var(--a1);color:#fff}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  .msg{font-size:12px;color:var(--tx2);min-height:17px}
  .msg.err{color:var(--red)}
  .list{border:1px solid var(--ln);border-radius:11px;overflow:hidden;background:var(--surf)}
  .it{display:flex;align-items:center;gap:9px;padding:8px 11px;border-top:1px solid var(--ln);font-size:12px}
  .it:first-child{border-top:0}
  .it b{font-weight:620;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;flex:none}
  .pill.ok{background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn)}
  .pill.sg{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
  .pill.no{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
  .sub{font-size:11px;color:var(--tx3);padding:0 11px 8px}
  .hint{font-size:11.5px;color:var(--tx3);line-height:1.45}
</style>
</head>
<body>
  <header><span class="dot"></span><h1>Aiko Daily Check</h1></header>
  <main>
    <div>
      <label for="url">Dashboard URL</label>
      <input id="url" type="text" placeholder="http://localhost:3000" spellcheck="false">
    </div>
    <div id="orgWrap" style="display:none">
      <label for="org">Organization</label>
      <select id="org"></select>
    </div>
    <div class="row">
      <button id="load">Load channels</button>
      <button id="run" class="p" disabled>Collect</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="out"></div>
    <button id="push" style="display:none">Send to dashboard</button>
    <div class="hint">Counts are read in this browser, using the sessions you are already
      signed into. Facebook numbers are a suggestion — check them in the dashboard.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
